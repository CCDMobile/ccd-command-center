/* ─── schema fields for create mode ─── */
function cFields(){const it=C.it;if(!it||!it.sch||!it.sch.schema)return[];const flat=eFlat(it.sch.schema.attributes,[],null);return flat.filter(a=>!C_CONTAINER(String(a.id))&&!(!eAt(a)&&(a.children||[]).length));}
function cSa(id){return cFields().find(a=>String(a.id)===String(id))||null;}
function cAllowed(sa){return (sa&&sa.possibleValues||[]).map(o=>o&&o.value).filter(v=>v!=null).map(String);}
/* canonical match of a free value against the allowed list (WF-019: the value, never the label) */
function cCanon(sa,v){const pv=cAllowed(sa);if(!pv.length)return{v,ok:true};const s=String(v).trim();if(/^does not apply$/i.test(s))return{v:E_DNA,ok:!!(sa.flags&&sa.flags.notApplicable)};const hit=pv.find(x=>x===s)||pv.find(x=>x.toLowerCase()===s.toLowerCase());if(hit)return{v:hit,ok:true};const byLabel=(sa.possibleValues||[]).find(o=>o&&o.label&&String(o.label).toLowerCase()===s.toLowerCase());if(byLabel)return{v:String(byLabel.value),ok:true};return{v:s,ok:!!(sa.flags&&sa.flags.custom)};}
function cNum(v){if(v==null||v==='')return null;const n=Number(v);return isFinite(n)&&n>0?String(Math.round(n*100)/100):null;}
function cColVal(item,col){const cols=Array.isArray(col)?col:[col];for(const c of cols){const v=item[c];if(v!=null&&String(v).trim()!=='')return{v,col:c};}return null;}
function cTransform(sa,raw,t){if(raw==null)return[];if(t==='days_to_hours'){const n=Number(raw);return isFinite(n)?[String(Math.round(n*24))]:[];}if(t==='yn'){const s=String(raw).trim().toUpperCase();return s==='Y'||s==='YES'?['Yes']:s==='N'||s==='NO'?['No']:[];}
if(t==='find_value'){const s=String(raw);const pv=cAllowed(sa).sort((a,b)=>b.length-a.length);const hit=pv.find(x=>new RegExp('\\b'+x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(s));return hit?[hit]:[];}
if(t==='list'){return String(raw).split(/[,;\/]| and /i).map(x=>x.trim()).filter(Boolean);}
if(Array.isArray(raw))return raw.map(String);const at=eAt(sa);if(at==='DECIMAL'||at==='INTEGER'){const n=cNum(raw);return n?[at==='INTEGER'?String(Math.round(Number(n))):n]:[];}return[String(raw)];}
function cSet(id,vals,src){const it=C.it;const sa=cSa(id)||{};let review=!!src.review;const out=[];const mapped=[];(vals||[]).forEach(v=>{let c=cCanon(sa,v);if(!c.ok&&src.syn){const m=cSynMap(sa,v);if(m.v==null){mapped.push(`dropped "${v}"`);return;}if(m.ok){if(m.mapped)mapped.push(`"${v}" → ${m.v}`);c={v:m.v,ok:true};review=true;}}if(!out.includes(c.v))out.push(c.v);if(!c.ok)review=true;});if(!out.length)return false;if(mapped.length&&!src.why)src=Object.assign({},src,{why:'mapped from free text: '+mapped.join('; ')+' — check (WF-023)'});if(!eMulti(sa)&&out.length>1){out.length=1;review=true;}it.P[id]=out;it.src[id]=Object.assign({},src,{review,why:src.why||(review?'not an allowed value — pick one (WF-023)':null)});return true;}
/* pre-fill: constants/defaults < items columns < title hints < mapping profile. Each value carries its source. */
function cPrefill(){const it=C.it;const item=it.item;it.P={};it.src={};const f=cFields();const ids=new Set(f.map(a=>String(a.id)));
/* attribute 1 = the class selector: its single possible value */
const a1=cSa('1');if(a1){const pv=cAllowed(a1);if(pv.length===1){it.P['1']=[pv[0]];it.src['1']={src:'class',ref:'attribute 1'};}}
Object.keys(C_HINTS).forEach(id=>{if(!ids.has(id)||C_SPECIAL[id]&&id!=='featureDescription::romanceCopy')return;const h=C_HINTS[id];if(h.typed){const ref=['wayfair_price','wholesale_price'].filter(c=>item[c]!=null&&String(item[c]).trim()!=='').map(c=>`items.${c} = ${item[c]}`).join(' · ');it.src[id]={src:'typed',ref:null,review:true,why:'Type the base cost (what Wayfair pays CCD). It is never pre-filled.'+(ref?' For reference: '+ref+'.':'')};return;}const sa=cSa(id);const got=h.col?cColVal(item,h.col):null;if(got){const vals=cTransform(sa,got.v,h.transform);if(vals.length&&cSet(id,vals,{src:'items',ref:got.col,review:!!h.review,why:h.review||null}))return;}if(h.dflt)cSet(id,[h.dflt],{src:'default',ref:h.dflt});});
f.forEach(sa=>{const id=String(sa.id);if(it.P[id]||C_SPECIAL[id])return;const t=C_TITLE_HINTS.find(x=>x.re.test(String(sa.title||'')));if(!t)return;const got=cColVal(item,t.col);if(!got)return;const vals=cTransform(sa,got.v,t.transform);if(vals.length&&cSet(id,vals,{src:'items',ref:got.col+' (by title)',review:t.transform==='list'||t.transform==='find_value',syn:t.transform==='list'}))return;if(vals.length)it.src[id]={src:'items',ref:got.col,review:true,why:`items.${got.col} = "${String(got.v).slice(0,60)}" did not map to an allowed value`};else if(got)it.src[id]={src:'items',ref:got.col,review:true,why:`items.${got.col} = "${String(got.v).slice(0,60)}" did not map to an allowed value`};});
/* mapping profile (per class) wins */
(it.profile||[]).forEach(p=>{const id=String(p.attribute_id);if(!ids.has(id)||C_SPECIAL[id]&&id!=='featureDescription::romanceCopy')return;const sa=cSa(id);if(p.source==='constant'&&p.source_ref!=null){cSet(id,String(p.source_ref).split('\n').filter(Boolean),{src:'profile',ref:'constant'});return;}if(p.source==='column'&&p.source_ref){const got=cColVal(item,p.source_ref);if(got){const vals=cTransform(sa,got.v,p.transform||null);if(vals.length)cSet(id,vals,{src:'profile',ref:p.source_ref+(p.transform?' · '+p.transform:'')});}}});
/* special fields */
let fb=item.feature_bullets;if(typeof fb==='string'){try{fb=JSON.parse(fb);}catch(e){fb=fb.split('\n');}}it.bullets=Array.isArray(fb)?fb.map(s=>String(s).trim()).filter(Boolean):[];
it.imgs=eDbImages(item.image_urls).map(x=>x.url).filter(u=>!eImgBad(u));
it.brand=cGuessBrand(item);}
function cGuessBrand(item){const bs=C.brands||[];if(item.wayfair_manufacturer_id&&bs.some(b=>b.manufacturerId===String(item.wayfair_manufacturer_id)))return{id:String(item.wayfair_manufacturer_id),src:'items.wayfair_manufacturer_id'};const n=String(item.brand_name||'').toLowerCase().replace(/[^a-z0-9]/g,'');const hit=bs.find(b=>String(b.name||'').toLowerCase().replace(/[^a-z0-9]/g,'')===n);if(hit)return{id:hit.manufacturerId,src:'items.brand_name'};const ccd=bs.find(b=>b.manufacturerId===C_BRAND_FALLBACK);if(ccd)return{id:ccd.manufacturerId,src:`fallback: ${ccd.name||'Country Charm Decor'} — "${item.brand_name||''}" is not associated with CCD on Wayfair`,review:true};return{id:null,src:null};}
const C_BRAND_FALLBACK='102118';   /* Country Charm Decor (brands.list, WF-047) */

/* ─── final values: form + specials → parent "No" children → conditionality (after ALL values are set, WF-044) ─── */
function cFinal(){const it=C.it;const f=cFields();const ids=new Set(f.map(a=>String(a.id)));const S={};Object.keys(it.P).forEach(k=>{const v=eVals(it.P[k]);if(v.length&&ids.has(k))S[k]=v;});
if(ids.has('core::supplierPartNumber')&&it.spn)S['core::supplierPartNumber']=[String(it.spn).trim()];
if(ids.has('core::manufacturerId')&&it.brand&&it.brand.id)S['core::manufacturerId']=[String(it.brand.id)];
if(ids.has('featureDescription::genericFeatures')){const b=it.bullets.map(s=>String(s).trim()).filter(Boolean);if(b.length)S['featureDescription::genericFeatures']=b;}
if(ids.has('media::imageValue')&&it.imgs.length)S['media::imageValue']=it.imgs.slice();
const notes=[],ruled={};
/* Guide to Product Taxonomy: a parent answered No / Does Not Apply → its empty N/A-eligible children get Does Not Apply */
f.forEach(sa=>{(sa.children||[]).forEach(ch=>{const cid=String(ch.id),pid=String(sa.id);const pv=S[pid]||[];if(!pv.length||S[cid])return;if(pv.every(v=>/^(no|does not apply)$/i.test(v))){const cs=cSa(cid);if(cs&&cs.flags&&cs.flags.notApplicable){S[cid]=[E_DNA];ruled[cid]=`parent ${pid} = ${pv[0]}`;}}});});
const rs=it.sch&&it.sch.schema&&it.sch.schema.rules&&it.sch.schema.rules.conditionality;const has=(vals,ans)=>(vals||[]).some(v=>(ans||[]).some(a=>eNorm(v).toLowerCase()===eNorm(a).toLowerCase()));
if(Array.isArray(rs))for(let pass=0;pass<3;pass++)rs.forEach(set=>(set.rules||[]).forEach(rl=>{const up=rl.upstreamCondition;if(!up)return;const uid=String(up.taxonomyAttributeId);const hv=S[uid]||[];const hit=up.operation==='DOES_NOT_CONTAIN'?(hv.length>0&&!has(hv,up.answers)):has(hv,up.answers);if(!hit)return;
(rl.downstreamConditions||[]).forEach(dn=>{const did=String(dn.taxonomyAttributeId);const ans=(dn.answers||[]).filter(x=>x!=null&&x!=='').map(eNorm);const tag=`${uid} ${up.operation} ${JSON.stringify(up.answers)} → ${dn.operation} ${did} ${JSON.stringify(ans)}`;
if(!ids.has(did)){notes.push('Rule skipped — target not in this class (WF-044): '+tag);return;}
if(dn.operation==='ASSIGN'&&ans.length){if(!eSame(S[did],ans,true)){if(S[did]&&S[did].length&&it.src[did]&&it.src[did].src==='you')notes.push(`Rule changed your value for ${did}: ${tag}`);S[did]=ans;ruled[did]=tag;}}
else if(dn.operation==='EXCLUDE'){const cur=S[did]||[];if(!cur.length)return;const keep=ans.length?cur.filter(v=>!has([v],ans)):[];if(keep.length!==cur.length){if(keep.length)S[did]=keep;else delete S[did];ruled[did]=tag;}}});}));
return{S,ruled,notes:[...new Set(notes)]};}

/* ─── pre-flight: blockers stop Validate; warnings are shown ─── */
function cCheck(fin){const it=C.it;const B=[],W=[];const S=fin.S;const f=cFields();
if(!it.sch||!it.sch.schema)B.push('No class schema — pick a class and import its schema.');
if(!it.spnCheck||!it.spnCheck.ok||it.spnCheck.spn!==String(it.spn||'').trim())B.push('Supplier part number: '+((it.spnCheck&&it.spnCheck.spn===String(it.spn||'').trim()&&it.spnCheck.why)||'check it (↻ Check).'));
if(f.some(a=>String(a.id)==='core::manufacturerId')&&!(it.brand&&it.brand.id))B.push('Brand: pick a manufacturer from brands.list (WF-047).');
if(it.brand&&it.brand.review)W.push('Brand: '+it.brand.src+'.');
if(f.some(a=>String(a.id)==='price::wholesalePrice')&&!((it.src['price::wholesalePrice']||{}).src==='you'&&(S['price::wholesalePrice']||[]).length))B.push('Base cost (price::wholesalePrice): type it — it is never pre-filled.');
{const d=(S['shippingAndFulfillment::depth']||[])[0],w=(S['shippingAndFulfillment::width']||[])[0],h=(S['shippingAndFulfillment::height']||[])[0];if(d&&d===w&&w===h)W.push(`Carton is ${d} × ${w} × ${h} in — Wayfair warns "This carton is a cube" (WF-063). Enter the real carton size.`);}
f.forEach(sa=>{const id=String(sa.id);const v=S[id]||[];const req=String(sa.requirement||'').toUpperCase();const name=`${sa.title||id} (${id})`;
if(!v.length){const par=String(sa.parentAttributeId||sa._parent||'');if(req==='REQUIRED'&&!(par&&C_CONTAINER(par)))B.push(`${name}: required.`);return;}
const dna=v.some(x=>x===E_DNA);if(dna&&!(sa.flags&&sa.flags.notApplicable))B.push(`${name}: Does Not Apply is not allowed here.`);if(dna&&v.length>1)B.push(`${name}: Does Not Apply must be the only value.`);
if(!eMulti(sa)&&v.length>1&&id!=='media::imageValue')B.push(`${name}: takes one value.`);
const pv=cAllowed(sa);if(pv.length&&!(sa.flags&&sa.flags.custom)&&id!=='core::manufacturerId'){const bad=v.filter(x=>x!==E_DNA&&!pv.includes(x));if(bad.length)B.push(`${name}: not an allowed value: ${bad.join(', ')} (WF-019).`);}
const at=eAt(sa);if(at==='INTEGER'||at==='DECIMAL'){const bad=v.filter(x=>x!==E_DNA&&!(at==='INTEGER'?/^-?\d+$/:/^-?\d+(\.\d+)?$/).test(x));if(bad.length)B.push(`${name}: not a ${at==='INTEGER'?'whole ':''}number: ${bad.join(', ')}.`);}
if(it.src[id]&&it.src[id].review&&!fin.ruled[id])W.push(`${name}: needs review (${it.src[id].why||it.src[id].ref||''}).`);});
if(!(S['media::imageValue']||[]).length)B.push('Images: at least one https JPG/PNG image (WF-048).');(S['media::imageValue']||[]).forEach((u,i)=>{const b=eImgBad(u);if(b)B.push(`Image ${i+1}: ${b}`);});
const nb=(S['featureDescription::genericFeatures']||[]).length;if(!(S['featureDescription::romanceCopy']||[]).length&&nb<3)B.push('Content: marketing copy or at least 3 feature bullets.');
['depth','width','height','weight'].forEach(k=>{if(f.some(a=>String(a.id)==='shippingAndFulfillment::'+k)&&!(S['shippingAndFulfillment::'+k]||[]).length)B.push(`Carton ${k}: required for the carton.`);});
const cw=Number((S['shippingAndFulfillment::weight']||[])[0]),pw=Number((S['shippingAndFulfillment::productWeight']||[])[0]);if(cw&&pw&&cw<pw)W.push('Carton weight is below product weight (Wayfair warns on this).');
if(!(S['core::universalProductCode']||[]).length)W.push('UPC is recommended (Wayfair warns; the warning fails a validate with ignoreWarnings:false, WF-042).');
return{B:[...new Set(B)],W:[...new Set(W)]};}
function cPayload(fin){const it=C.it;const attrs=Object.keys(fin.S).sort().map(k=>({attributeId:k,values:fin.S[k].map(v=>v===E_DNA?E_DNA:v)}));return{productId:String(it.spn).trim(),classId:String(it.cid),attributes:attrs};}
function cHash(p){return JSON.stringify(p);}

/* ─── create.status polling (always, WF-043) ─── */
async function cPollStatus(target,jobId,onTick){let errs=0,last=null;for(let i=0;i<C_POLL_S.length;i++){await E_SLEEP(C_POLL_S[i]);let r;try{r=await cCall(target,'create.status',{jobId});errs=0;}catch(e){const m=e.message||String(e);if(/access denied|forbidden|unauthori[sz]ed|not authori[sz]ed|scope/i.test(m))return{outcome:'NO_STATUS_SCOPE',error:m,polls:i+1};if(++errs>=3)return{outcome:'POLL_ERROR',error:m,polls:i+1};continue;}last=r.data||{};last.polls=i+1;if(onTick)onTick(last);if(last.outcome&&last.outcome!=='IN_PROGRESS')return last;}return Object.assign({outcome:'IN_PROGRESS',timedOut:true},last||{});}

/* ─── one create.submit request + its wayfair_jobs row ─── */
async function cSend(target,mode,payload,ignoreWarnings){const it=C.it;const validateOnly=mode!=='submit';const env=target==='sandbox'?'sandbox':WB.env;
const params={products:[Object.assign({},payload,{ignoreWarnings})],validateOnly,ignoreWarnings,rejectAllOnErrors:true,jobContext:{productAdditionRequestId:null,hasMoreProducts:false}};
const res={target,env,mode,jobId:null,batchId:null,sync:null,status:null,outcome:null,error:null,jobRow:null};
res.jobRow=await jInsert({kind:'create',validate_only:validateOnly,status:'PENDING',payload:{env,target,spn:payload.productId,item_id:it.id,item_sku:it.item.sku,class_id:it.cid,mode:validateOnly?'validate':'submit',ignore_warnings:ignoreWarnings,attr_count:payload.attributes.length,params,wb_version:WB_VERSION}});
try{const r=await cCall(target,'create.submit',params);const d=r.data||{};res.jobId=d.jobId||null;res.batchId=d.batchId||null;res.sync=(d.results||[])[0]||null;res.proxyWarnings=r.warnings||null;if(!res.jobId)throw new Error('create.submit returned no jobId (WF-003).');await jUpdate(res.jobRow,{wayfair_request_id:res.jobId,batch_id:res.batchId,status:'IN_PROGRESS',result:{sync:res.sync,flawCounts:d.flawCounts||null,proxyWarnings:res.proxyWarnings}});}
catch(e){res.outcome='REJECTED';res.error=e.message||String(e);await jUpdate(res.jobRow,{status:'REJECTED',completed_at:new Date().toISOString(),result:{outcome:'REJECTED',error:res.error,graphqlErrors:(e.envelope&&e.envelope.graphqlErrors)||null}});return res;}
const syncErr=(res.sync&&res.sync.flaws||[]).filter(f=>f.flawType==='ERROR');
const st=await cPollStatus(target,res.jobId,x=>{it.prog=`${target} ${validateOnly?'validate':'submit'}: ${x.outcome}${x.polls?` · poll ${x.polls}`:''}`;cRenderBar();});res.status=st;
if(st.outcome==='NO_STATUS_SCOPE'){res.outcome=syncErr.length?'FAILED':(validateOnly?'SYNC_ONLY':'SUBMITTED');}else if(st.outcome==='POLL_ERROR'||st.timedOut)res.outcome='IN_PROGRESS';else res.outcome=st.outcome;
const done=!['IN_PROGRESS','SUBMITTED'].includes(res.outcome);await jUpdate(res.jobRow,Object.assign({result:{sync:res.sync,status:st,outcome:res.outcome,proxyWarnings:res.proxyWarnings}},done?{status:res.outcome,completed_at:new Date().toISOString()}:{status:res.outcome==='SUBMITTED'?'SUBMITTED':'IN_PROGRESS'}));return res;}
function cFlaws(res){const p=res&&res.status&&Array.isArray(res.status.products)?res.status.products[0]:null;const deep=p?p.flaws||[]:[];const sync=(res&&res.sync&&res.sync.flaws)||[];const seen=new Set(),out=[];[...sync.map(f=>Object.assign({via:'sync'},f)),...deep.map(f=>Object.assign({via:'deep'},f))].forEach(f=>{const k=[f.attributeId,f.flawType,f.flaw,f.rank,f.parentRank].join('|');if(seen.has(k))return;seen.add(k);out.push(f);});return out;}

/* ─── actions ─── */
async function cRun(action){const it=C.it;if(!it||it.busy)return;const fin=cFinal();const chk=cCheck(fin);if(chk.B.length){cFlash('Fix the blocked items first ('+chk.B.length+').');return;}const payload=cPayload(fin);const hash=cHash(payload);
let target,mode,iw;
if(action==='valSbx'){target='sandbox';mode='validate';iw=false;}else if(action==='valSbxIW'){target='sandbox';mode='validate';iw=true;}else if(action==='preProd'){target='main';mode='validate';iw=true;}else if(action==='subSbx'){target='sandbox';mode='submit';iw=true;}else if(action==='subProd'){target='main';mode='submit';iw=true;}else return;
if(target==='main'&&action==='preProd'&&WB.env!=='production'){cFlash('The main proxy is not on production.');return;}
if(target==='sandbox'&&!SBX.url){cFlash('No sandbox proxy is set up yet (settings.proxy_urls.wayfair_catalog_sandbox).');return;}
if(mode==='submit'){const why=cSubmitGuard(target,hash);if(why){cFlash(why);return;}
if(target==='main'){try{const h=await wbRead('health',{});if(h.env!=='production'){cFlash('The main proxy is not on production right now. Nothing was sent.');return;}}catch(e){cFlash('Health check failed: '+(e.message||e));return;}
const typed=prompt(`REAL PRODUCTION SUBMIT — adds a NEW product to Wayfair.\n\nPart number: ${payload.productId}\nItem: ${it.item.sku} ${it.item.product_name||''}\nClass: ${it.cid}\nAttributes: ${payload.attributes.length}\n\nDeep-validated in sandbox ${new Date(it.lastVal.at).toLocaleTimeString()}.\nitems.wayfair_sku is NOT written now (only after Wayfair accepts it, with your OK).\n\nType the part number to confirm:`);if(typed==null||typed.trim()!==payload.productId){cFlash('Not confirmed. Nothing was sent.');return;}}
else if(!confirm(`Real SANDBOX submit of ${payload.productId}? Sandbox reads will not show it (WF-058).`))return;}
it.busy=true;it.prog='Sending…';cRenderBar();const t0=Date.now();let res;try{res=await cSend(target,mode,payload,iw);}catch(e){res={target,mode,outcome:'REJECTED',error:e.message||String(e)};}
const flaws=cFlaws(res);const errs=flaws.filter(f=>f.flawType==='ERROR');
if(mode==='validate'){const pass=target==='sandbox'?res.outcome==='SUCCEEDED':(res.outcome==='SUCCEEDED'||(res.outcome==='SYNC_ONLY'&&!errs.length));if(target==='sandbox')it.lastVal={hash,at:Date.now(),pass,iw,res};else it.prodChk={hash,at:Date.now(),pass,deep:res.outcome==='SUCCEEDED',res};}
it.results={action,target,mode,iw,res,flaws,at:new Date().toISOString(),ms:Date.now()-t0};it.busy=false;it.prog='';
if(mode==='submit'&&res.jobId)it.job={target,jobId:res.jobId,spn:payload.productId,at:Date.now(),outcome:res.outcome};
wbLog(mode==='submit'?'WF_WORKBENCH_CREATE_SUBMIT':'WF_WORKBENCH_CREATE_VALIDATE',`${mode==='submit'?'Submit':'Validate'}${iw&&mode!=='submit'?' (ignoring warnings)':''} ${payload.productId} via ${target} (${res.env||target}): ${res.outcome}${flaws.length?` · ${errs.length} error(s), ${flaws.length-errs.length} warning(s)`:''}`,{spn:payload.productId,item_id:it.id,item_sku:it.item.sku,class_id:it.cid,target,env:res.env||null,validate_only:mode!=='submit',ignore_warnings:iw,job_id:res.jobId||null,batch_id:res.batchId||null,outcome:res.outcome,flaws:flaws.slice(0,60),rules:Object.keys(fin.ruled).length,job_row:res.jobRow||null,error:res.error||null,ms:Date.now()-t0,wb_version:WB_VERSION});cRender();}
function cSubmitGuard(target,hash){const it=C.it;const v=it.lastVal;if(!v||!v.pass||v.hash!==hash)return'Submit needs a passing SANDBOX deep validation of exactly this payload (Validate in sandbox).';if(Date.now()-v.at>C_VALID_MAX_MIN*60000)return`The sandbox validation is older than ${C_VALID_MAX_MIN} min. Validate again.`;
if(target==='main'){if(WB.env!=='production')return'The main proxy is not on production.';const p=it.prodChk;if(!p||!p.pass||p.hash!==hash)return'Run the production pre-check (validate-only) on exactly this payload first.';if(Date.now()-p.at>C_VALID_MAX_MIN*60000)return'The production pre-check is too old. Run it again.';}
return null;}

<div class="e-hint">${sc&&sc.spn===String(it.spn||'').trim()?(sc.ok?'<span style="color:var(--green)">✓ free — not in items.wayfair_sku, not on Wayfair</span>':`<span style="color:var(--red)">✗ ${esc(sc.why)}</span>`):'Not checked yet.'} Proposed as CCD + SKU. It becomes items.wayfair_sku only after Wayfair accepts it and you press Link.</div>

function cSrcBadge(id){const s=C.it.src[id];if(!s)return'';const lbl=s.src==='items'?'items · '+s.ref:s.src==='profile'?'profile · '+s.ref:s.src==='default'?'default':s.src==='class'?'class':s.src==='you'?'you':s.src;return ` <span class="badge ${s.review?'b-warn':'b-none'}" title="${escA(s.why||'')}">${esc(lbl)}${s.review?' · needs review':''}</span>`;}

const content=`<div class="sec"><div class="sec-h">📝 Content &amp; images</div>
<div class="e-lbl">Marketing copy <span class="badge b-purple">featureDescription::romanceCopy</span>${cSrcBadge('featureDescription::romanceCopy')}</div><textarea class="e-in" rows="4" oninput="cSetVal('featureDescription::romanceCopy',this.value.trim())">${esc((it.P['featureDescription::romanceCopy']||[])[0]||'')}</textarea>

<div class="e-lbl" style="margin-top:12px;">Images <span class="badge b-purple">media::imageValue · click to pick, first = lead · JPG/PNG only (WF-048)</span></div><div class="img-grid">${imgHtml}</div>${etsyHtml}${it.imgs.length>1?`<div class="muted small" style="margin-top:4px;">Order: ${it.imgs.map((u,i)=>`<a href="javascript:void 0" onclick="cImgUp('${escA(u)}')" title="move up">${i+1}. ${esc(u.split('/').pop())}</a>`).join(' · ')}</div>`:''}</div>`;
wrap.innerHTML=content+`<div class="sec"><div class="sec-h">🏷 Attributes <span class="muted" style="font-weight:400;">${f.length} from the class schema (${esc(it.sch.source)}) · rule-set values are marked · ${it.profile.length} mapping(s) saved for this class</span> <button class="btn tiny" onclick="cSaveProfile()">💾 Save mapping for class ${esc(it.cid)}</button></div>`+
[...E_REQ_ORDER,'OTHER'].filter(k=>groups[k]).map(k=>`<details class="e-grp" ${k==='OPTIONAL'||k==='OTHER'?'':'open'}><summary>${esc(k)} <span class="muted">(${groups[k].length})</span></summary><div class="e-fields">${groups[k].map(a=>`<div class="e-field">${cFieldInner(a,fin)}</div>`).join('')}</div></details>`).join('')+'</div>';}
function cFieldInner(sa,fin){const it=C.it;const id=String(sa.id);const v=it.P[id]||[];const at=eAt(sa);const naOK=!!(sa.flags&&sa.flags.notApplicable);const isNA=v.length===1&&eNorm(v[0])===E_DNA;const pv=(sa.possibleValues||[]).filter(o=>o&&o.value!=null);const custom=!!(sa.flags&&sa.flags.custom);const ruled=fin.ruled[id];const fv=fin.S[id];
const meas=sa.measurement&&sa.measurement.unit?` <span class="muted small">(${esc(sa.measurement.unit)})</span>`:'';const naBtn=naOK?` <button class="btn tiny ${isNA?'on':''}" onclick="cNA('${escA(id)}')">N/A</button>`:'';
let ctl;if(at==='MULTI_CHOICE'){const opts=pv.map(o=>({v:String(o.value),l:o.label&&o.label!==o.value?`${o.value} — ${o.label}`:String(o.value)}));v.filter(x=>eNorm(x)!==E_DNA&&!opts.some(o=>o.v===x)).forEach(x=>opts.push({v:x,l:x+' (not in list)'}));ctl=`${opts.length>12?`<input class="e-in mc-f" placeholder="Filter ${opts.length} options…" oninput="eMcFilter(this)">`:''}<div class="mc-box">${opts.map(o=>`<label class="mc-o"><input type="checkbox" data-v="${escA(o.v)}" ${isNA?'disabled':''} ${v.includes(o.v)?'checked':''} onchange="cMc('${escA(id)}',this.dataset.v,this.checked)"> ${esc(o.l)}</label>`).join('')}</div>${naBtn}`;}
else if((pv.length||at==='BOOLEAN')&&!custom&&!sa.isMultiValue){const list=pv.length?pv.map(o=>({v:String(o.value),l:o.label&&o.label!==o.value?`${o.value} — ${o.label}`:String(o.value)})):[{v:'Yes',l:'Yes'},{v:'No',l:'No'}];const cur=v[0]||'';const extra=cur&&eNorm(cur)!==E_DNA&&!list.some(o=>o.v===cur)?`<option value="${escA(cur)}" selected>${esc(cur)} (not in list)</option>`:'';ctl=`<select class="e-in" onchange="cSetVal('${escA(id)}',this.value)"><option value="">— not set —</option>${list.map(o=>`<option value="${escA(o.v)}" ${o.v===cur?'selected':''}>${esc(o.l)}</option>`).join('')}${extra}${naOK?`<option value="${E_DNA}" ${isNA?'selected':''}>Does Not Apply</option>`:''}</select>`;}

else{const num=at==='INTEGER'||at==='DECIMAL';const dl=custom&&pv.length?`<datalist id="cdl-${escA(id)}">${pv.map(o=>`<option value="${escA(o.value)}">`).join('')}</datalist>`:'';ctl=`<input class="e-in" ${num?'inputmode="decimal"':''} ${dl?`list="cdl-${escA(id)}"`:''} ${isNA?'disabled':''} value="${escA(isNA?'':(v[0]||''))}" oninput="cSetVal('${escA(id)}',this.value.trim())">${dl}${naBtn}`;}
const s=it.src[id];return `<div class="e-f-h"><span class="e-f-t">${esc(sa.title||id)}</span>${meas} <span class="mono muted small">${esc(id)}</span>${cSrcBadge(id)}${ruled?` <span class="badge b-warn" title="${escA(ruled)}">rule → ${esc((fv||[]).join(', ')||'(removed)')}</span>`:''}</div>${ctl}${sa.description?`<div class="e-hint">${esc(String(sa.description).slice(0,200))}</div>`:''}${s&&s.why?`<div class="e-hint" style="color:var(--yellow)">${esc(s.why)}</div>`:''}${s&&(s.src==='you'||s.src==='default')?`<label class="small muted"><input type="checkbox" ${s.keep?'checked':''} onchange="cKeep('${escA(id)}',this.checked)"> keep this value for class ${esc(it.cid)} (mapping)</label>`:''}${cFieldFlaws(id)}`;}
function cFieldFlaws(id){const r=C.it.results;if(!r)return'';return (r.flaws||[]).filter(f=>String(f.attributeId)===id).map(f=>`<div class="e-prob" style="${f.flawType==='WARNING'?'color:var(--yellow)':''}">${f.flawType==='ERROR'?'✗':'⚠'} ${esc(f.flaw)}${f.rank?` (r${esc(f.rank)})`:''}${f.parentRank&&f.parentRank>1?` (item ${esc(f.parentRank)})`:''}</div>`).join('');}
function cRenderBar(){const it=C.it;const bar=document.getElementById('cBar'),rv=document.getElementById('cReview');if(!it||!it.item||!bar)return;const fin=cFinal();const chk=cCheck(fin);const payload=cPayload(fin);const hash=cHash(payload);const v=it.lastVal,p=it.prodChk;
const vFresh=v&&v.pass&&v.hash===hash&&(Date.now()-v.at)<C_VALID_MAX_MIN*60000;const pFresh=p&&p.pass&&p.hash===hash&&(Date.now()-p.at)<C_VALID_MAX_MIN*60000;const ok=!chk.B.length&&!it.busy;
const vState=!v?'<span class="muted">not validated</span>':v.hash!==hash?'<span class="badge b-warn">changed since validation</span>':v.pass?`<span class="badge b-live">sandbox ✓ ${esc(new Date(v.at).toLocaleTimeString())}${v.iw?' · warnings ignored':''}</span>`:'<span class="badge b-notlive">sandbox validation FAILED</span>';
const pState=!p?'':p.hash!==hash?'':p.pass?`<span class="badge ${p.deep?'b-live':'b-gold'}">prod pre-check ✓${p.deep?'':' (sync only)'}</span>`:'<span class="badge b-notlive">prod pre-check FAILED</span>';

<button class="btn primary" ${ok&&SBX.url?'':'disabled'} onclick="cRun('valSbx')" title="create.submit validateOnly:true, ignoreWarnings:false → poll create.status (sandbox proxy)">✓ Validate in sandbox</button>${v&&v.hash===hash&&!v.pass&&ok?'<button class="btn" onclick="cRun(\'valSbxIW\')">Validate ignoring warnings</button>':''}

${t?(t.err?`<div class="banner err">${esc(t.err)}</div>`:`<div class="banner ${t.wf?'ok':'info'}">${t.status?`create.status: <b>${esc(t.status.outcome||'?')}</b> ${esc(JSON.stringify(t.status.counts||{}))}. `:''}${t.statusErr?`create.status not readable (${esc(t.statusErr)}) — confirm in Partner Home. `:''}${t.env?(t.wf?`On Wayfair: ${stBadge(t.wf.status)} listing ${esc((t.wf.listingIds||[]).join(', ')||'—')}. COMPLETED ≠ live: keep tracking until LIVE.`:'Not returned by catalog.read yet — Wayfair can take a while to create it. Track again later.'):esc(t.note||'')}</div>`):''}

rv.innerHTML=`${chk.B.length?`<div class="banner err"><b>Blocked (${chk.B.length}):</b><ul style="margin:4px 0 0 18px;">${chk.B.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}${chk.W.length?`<div class="banner warn"><b>Warnings:</b><ul style="margin:4px 0 0 18px;">${chk.W.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}${fin.notes.length?`<div class="banner info"><b>Rules:</b><ul style="margin:4px 0 0 18px;">${fin.notes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
${res?`<div class="sec-t">${esc(res.mode==='submit'?'Submit':'Validate')} · ${esc(res.target==='sandbox'?'sandbox proxy':'main proxy ('+(res.res.env||'?')+')')} · ${esc(new Date(res.at).toLocaleTimeString())} · ${jBadge(res.res.outcome)} <span class="mono muted small">${esc(res.res.jobId||'')}</span></div>${res.res.error?`<div class="banner err">${esc(res.res.error)}</div>`:''}${res.mode==='validate'&&res.res.outcome==='FAILED'&&flawRows.length&&!flawRows.some(f=>f.flawType==='ERROR')?`<div class="banner warn"><b>Warnings only (WF-063).</b> With ignoreWarnings:false Wayfair marks a validation FAILED even when every flaw is a WARNING. The payload is not broken: fix what you can${flawRows.some(f=>/cube/i.test(f.flaw||''))?' — <b>enter the real carton size</b> (Wayfair says the carton is a cube)':''}, then use “Validate ignoring warnings”.</div>`:''}${res.res.outcome==='SYNC_ONLY'?'<div class="banner warn">Production accepted the request with no sync flaws, but create.status is not readable (Submissions Read locked), so deep validation there is unknown. The sandbox validation is the deep check.</div>':''}
${flawRows.length?`<div class="table-wrap"><table><thead><tr><th>Type</th><th>Attribute</th><th>Flaw</th><th>Rank</th><th>Via</th></tr></thead><tbody>${flawRows.map(f=>`<tr><td>${f.flawType==='ERROR'?'<span class="badge b-notlive">ERROR</span>':'<span class="badge b-warn">WARNING</span>'}</td><td class="mono small">${esc(f.attributeId)}</td><td class="wrap small">${esc(f.flaw)}</td><td class="mono small">${esc(f.rank||'')}${f.parentRank&&f.parentRank>1?'/'+esc(f.parentRank):''}</td><td class="small">${esc(f.via)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted small">No flaws.</div>'}`:''}
${trackHtml}

function escA(s){return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

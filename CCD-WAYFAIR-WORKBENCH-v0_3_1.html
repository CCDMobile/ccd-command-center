<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!--
  CCD Wayfair Catalog Workbench v0.3.1 — Phase 3 gaps closed (Session 21, 2026-10-02)
    Images   "Pull from Etsy" in Create: settings.proxy_urls.etsy getListing (as Etsy Image Pull / CM do), Etsy rank
             order = Wayfair rank (WF-064), fresh CDN URLs, JPG/PNG only (WF-048). Optional "Save to items" writes
             item_images + items.image_urls ONLY while the item has none (same guard as Etsy Image Pull), typed OK.
    Schemas  Create: "↻ Refresh from production" (Taxonomy Attributes Read is open, WF-060). Schemas tab:
             "Replace sandbox copies from production". The banner text no longer says the scope is locked.
    Pre-fill materials/colours: free text → allowed values through a small synonym table (C_SYN); junk such as
             "no props" or weights is dropped; every mapped value keeps the needs-review badge (WF-023).
             Brand fallback: Country Charm Decor 102118 when items.brand_name is not associated with CCD on
             Wayfair (Gerson, CTW, CWI …), shown as needs-review.
             Base cost (price::wholesalePrice) is never pre-filled: it must be TYPED (blocker); items.wayfair_price /
             wholesale_price are shown for reference only.
    Validate warnings-only FAILED is labelled as such (WF-063); a cube-carton warning (or L = W = H) asks for the
             real carton size.
  CCD Wayfair Catalog Workbench v0.3.0 — Phase 3: CREATE (Session 20, 2026-09-29)
    ➕ Create  Product Addition v2 from an items row with no wayfair_sku: class picker (80 relevant first) + cached
             schema (import a missing class through the SANDBOX proxy), brand picker from brands.list (WF-047),
             schema-driven form in create mode with every pre-filled value's source and needs-review badges (WF-023),
             mapping profiles per class (wayfair_mapping_profiles, attribute_id TEXT since 2026-09-29), images from
             items.image_urls (https JPG/PNG, WF-048), bullets, conditionality on the FINAL values (WF-044).
             Validate in sandbox (deep: poll create.status, WF-043) → production pre-check → Submit (typed confirm)
             → Track (create.status + catalog.read) → Link: the ONLY write of items.wayfair_sku, after Wayfair returns
             the part in production, with a typed confirm, guarded (wayfair_sku still empty) and re-selected.
    Sandbox proxy: settings.proxy_urls.wayfair_catalog_sandbox = a second copy of Catalog Proxy v3 pinned to sandbox
             (Paul, 2026-09-29). Its own small caller (sbxRead) refuses to send when that copy reports any env but
             sandbox, and never uses the production URL. The CM helper block below is untouched.
    Allow-list: create.submit added to the Workbench's own WF_READ_ACTIONS (CM told separately).
    Jobs: create jobs are re-checked with create.status on the proxy they were sent to.
    activity_log device WF-Workbench-v0.3.

  v0.2.4 — Phase 2: EDIT (Session 19, 2026-09-27)
    v0.2.4: bullet edits warn about WF-057; the post-submit re-read checks bullets in BOTH the listing view and the part.
    v0.2.3: when the listing view and the part attribute disagree on bullets/copy, the part wins + warning (WF-057).
    v0.2.2: (live sandbox run) schema fields de-duplicated; group content read from the listing's own attributes.
    v0.2.1: CM 2.7.1's wfCall/wfLoadUrl pasted VERBATIM (md5 98fee5aa…); the stand-in is gone.
    Listing Editor v1.2 parity on Read v2 + Product Update (replaces the deprecated supplierCatalog read, WF-046):
    ✏️ Edit   item name (update.items), group name / marketing copy / feature bullets (update.groups, full list),
             images from items.image_urls (update.media UPLOAD, https JPG/PNG), schema-driven attribute form
             (update.items.attributes). Validate (validateOnly:true, ignoreWarnings:false) → poll update.status until
             done → Submit (validateOnly:false) only after a passing Validate of the identical change set → re-read.
    🧾 Jobs   wayfair_jobs: one row per request, outcome per WF-041 (COMPLETED+problems = FAILED; BLOCKED).
    📐 Schemas Plan B: class schemas imported from the sandbox, labelled, never replacing a production copy.
    Proxy helper allow-list widened with update.items / update.groups / update.media (CM told separately).
    activity_log device WF-Workbench-v0.2. Everything from v0.1.1 below is unchanged unless noted.

  v0.1 — Phase 1: Health view + Channel ID backfill (Session 18, 2026-09-25)

  Built in Channel Manager conventions so it can be copied into CM as the Wayfair tab:
    - config from Supabase settings: proxy_urls.wayfair_catalog + api_keys.ccdApiKey (never hard-coded)
    - activity_log rows with device 'WF-Workbench-v0.1'
    - CM visual system, wf* / wb* namespace
    - proxy helper wfCall(action, params) + wfLoadUrl(); READ ACTIONS ONLY (WF_READ_ACTIONS)

  What it writes (all browser-side, WF-014):
    wayfair_catalog_snapshot  upsert on supplier_part_number — PRODUCTION reads only
    wayfair_attribute_schemas upsert (class_id, market) when taxonomy.attributes answers — PRODUCTION only
    items                     wayfair_listing_id / wayfair_status / wayfair_status_at ONLY, by the backfill,
                              only where items.wayfair_sku EXACTLY equals a Read v2 supplierPartNumber,
                              each UPDATE guarded by id + wayfair_sku + the listing id it read. PRODUCTION only.
    activity_log              one row per load / backfill

  Registry rules this file is built around:
    WF-007  every proxy POST is text/plain
    WF-012  graphqlErrors[0].message is shown first
    WF-014  Supabase writes happen in the browser, never in the proxy
    WF-040  insights are matched on insightTypeId, never on title
    WF-045  Read v2 core IDs need an alias map; Read v2 answerType/requirement are not trusted
    WF-049  one listing can hold several part numbers (many-to-one is normal)
    WF-051  output market codes are display only; never sent back
    WF-053  wayfair_listing_id is NEVER a match or write key. It is written here, never read to decide a write.
            items.wayfair_sku is never written.
-->

<body>
<div class="login-screen" id="loginScreen"><div class="login-card"><div class="login-logo">Wayfair Workbench</div><div class="login-sub">Country Charm Decor · v0.3.1 · Health · Create · Edit · Jobs</div><div class="login-field"><label>Supabase URL</label><input type="text" id="loginUrl" placeholder="https://your-project.supabase.co" autocomplete="off"></div><div class="login-field"><label>Supabase Key</label><input type="password" id="loginKey" placeholder="eyJhbGciOi…" autocomplete="off"></div><button class="login-btn" onclick="wbConnect()">Connect</button><div class="login-status" id="loginStatus"></div></div></div>

<div class="app" id="appShell">
  <div class="topbar">
    <div class="topbar-left"><div class="topbar-brand">🛋 Wayfair Workbench</div><div class="topbar-version">v0.3.1</div><span class="pill none" id="projPill">project?</span><span class="pill none" id="envPill" title="The environment the catalog proxy is pointed at, from its last answer">proxy: —</span></div>
    <div class="topbar-right"><button class="tbtn" onclick="wbLoadAll()">↻ Reload from Wayfair</button><button class="tbtn" onclick="wbDisconnect()">Disconnect</button></div>
  </div>
  <div class="tab-bar"><button class="tab-btn active" data-tab="health" onclick="wbTab('health')">🩺 Health</button><button class="tab-btn" data-tab="create" onclick="wbTab('create')">➕ Create</button><button class="tab-btn" data-tab="edit" onclick="wbTab('edit')">✏️ Edit</button><button class="tab-btn" data-tab="jobs" onclick="wbTab('jobs')">🧾 Jobs</button><button class="tab-btn" data-tab="schemas" onclick="wbTab('schemas')">📐 Schemas</button><button class="tab-btn" data-tab="backfill" onclick="wbTab('backfill')">🔗 Channel ID backfill</button></div>
  <div class="main">
    <div id="tabHealth" class="tab-content visible">
      <div id="hBanner"></div>
      <div class="stats-bar" id="hStats"></div>
      <div class="filter-bar">
        <input id="hQ" placeholder="Search part #, item SKU, name, listing ID…" oninput="hSetQ(this.value)">
        <select class="filter-select" id="hStatus" onchange="hSet('status',this.value)"><option value="">Any status</option><option value="LIVE">LIVE</option><option value="NOT_LIVE">NOT_LIVE</option><option value="LAUNCHING">LAUNCHING</option><option value="-">Not on Wayfair</option></select>
        <select class="filter-select" id="hFlag" onchange="hSet('flag',this.value)"><option value="">Any flag</option><option value="classMismatch">Class mismatch</option><option value="classMissing">Class missing in items</option><option value="insights">Has insights</option><option value="problems">Has problems</option><option value="shared">Listing shared by several parts</option><option value="multiListing">Several listing IDs</option><option value="hint">Possible typo match</option></select>
        <select class="filter-select" id="hIns" onchange="hSet('ins',this.value)"><option value="">Any insight type</option></select>

/* ═══ what CM's helper needs from the page ═══ */

/* ═══════════════ BEGIN CM 2.7.1 PROXY HELPER — VERBATIM ═══════════════
   Source: CCD-S110-wfCall-verbatim-from-CM-v2_7_1.js (CM S110). CM 2.7.1 file md5 d921d47960fcba1947df75e2d016e74f;

async function wfLoadUrl(){WF.url=null;try{const{data,error}=await sbClient.from('settings').select('key,value').in('key',['proxy_urls','api_keys']);if(error)throw error;for(const row of(data||[])){const v=typeof row.value==='string'?JSON.parse(row.value):row.value;if(row.key==='proxy_urls')WF.url=(v&&v.wayfair_catalog)||null;if(row.key==='api_keys')WF.key=(v&&v.ccdApiKey)||'';}}catch(e){WF.loadErr=String(e.message||e);}WF.loaded=true;}
async function wfCall(action,params){
  if(!WF_READ_ACTIONS.includes(action))throw new Error(`"${action}" is not allowed in Channel Manager ${CM_VERSION}: the Wayfair tab is read-only until the Edit and Create screens arrive from the Wayfair project.`);

/* Workbench allow-list (Phase 2 + 3). CM's own list stays read-only until Phase 4 — CM has been told it widened here
   (2026-09-27 for update.*, 2026-09-29 for create.submit). */

async function wbRead(action,params){let r;try{r=await wfCall(action,params);}catch(e){const ev=e&&e.envelope;if(ev&&ev.env){WB.env=ev.env;WB.version=ev.version||WB.version;WB.contract=ev.contract||WB.contract;WB.at=new Date().toISOString();wbShowEnv();}throw e;}const isEnv=r&&typeof r==='object'&&'success' in r&&'data' in r;const data=isEnv?r.data:r;if(isEnv&&r.env){WB.env=r.env;WB.version=r.version||null;WB.contract=r.contract||null;WB.at=new Date().toISOString();}else{/* helper returned data only: health's data carries env; otherwise ask health once */const hd=action==='health'?data:((await wfCall('health',{}))||{});const hdd=hd&&hd.data&&'success' in hd?hd.data:hd;WB.env=hdd&&hdd.env||null;WB.version=hdd&&hdd.version||null;WB.contract=hdd&&hdd.contract||null;WB.at=new Date().toISOString();}wbShowEnv();return{data,env:WB.env,version:WB.version};}

/* ═══ state ═══ */

/* ═══ connect ═══ */
function wbConnect(){const u=document.getElementById('loginUrl').value.trim(),k=document.getElementById('loginKey').value.trim(),s=document.getElementById('loginStatus');if(!u||!k){s.textContent='Enter both URL and Key';s.className='login-status error';return;}s.textContent='Connecting…';s.className='login-status';try{sbClient=supabase.createClient(u,k);sbClient.from('items').select('id',{count:'exact',head:true}).then(({count,error})=>{if(error)throw error;try{localStorage.setItem('ccdSupabaseUrl',u);localStorage.setItem('ccdSupabaseKey',k);}catch(e){}s.textContent=`Connected — ${count} items`;s.className='login-status ok';setTimeout(()=>{document.getElementById('loginScreen').style.display='none';document.getElementById('appShell').classList.add('visible');wbInit();},300);}).catch(e=>{s.textContent='Failed: '+e.message;s.className='login-status error';});}catch(e){s.textContent='Error: '+e.message;s.className='login-status error';}}

(function(){let u='',k='';try{u=localStorage.getItem('ccdSupabaseUrl')||'';k=localStorage.getItem('ccdSupabaseKey')||'';}catch(e){}if(u&&k){document.getElementById('loginUrl').value=u;document.getElementById('loginKey').value=k;wbConnect();}})();
function wbProject(){let url='';try{url=localStorage.getItem('ccdSupabaseUrl')||'';}catch(e){}const m=url.match(/^https?:\/\/([a-z0-9]+)\./i);const ref=m?m[1].toLowerCase():'?';const name=WB_PROJECTS[ref]||'UNKNOWN';const p=document.getElementById('projPill');p.className='pill '+(name==='PROD'?'ok':name==='STAGING'?'warn':'bad');p.textContent=name+' · '+ref;}
function wbShowEnv(){const p=document.getElementById('envPill');if(!p)return;const l=WB.env?WB:null;if(!l){p.className='pill none';p.textContent='proxy: —';return;}p.className='pill '+(l.env==='production'?'ok':'warn');p.textContent=`proxy ${l.version||'?'} · ${l.env||'?'} · contract ${l.contract||'?'}`;}
function wbWho(){try{return (localStorage.getItem('cmUserName')||'').trim();}catch(e){return '';}}
function wbLog(action,summary,details){if(!sbClient)return;sbClient.from('activity_log').insert({category:'wayfair',action,channel:'wayfair',summary:String(summary||'').slice(0,1000),details:details&&typeof details==='object'?details:{},device:WB_DEVICE,user_name:wbWho()||'Workbench'}).then(({error})=>{if(error)console.warn('[activity_log]',error.code,error.message);});}
async function wbRegisterVersion(){try{const{data}=await sbClient.from('settings').select('value').eq('key','tool_versions').limit(1);let v={};if(data&&data[0])v=typeof data[0].value==='string'?JSON.parse(data[0].value):data[0].value||{};if(v[WB_TOOL_KEY]===WB_VERSION)return;v[WB_TOOL_KEY]=WB_VERSION;await sbClient.from('settings').upsert({key:'tool_versions',value:v,updated_at:new Date().toISOString(),updated_by:WB_TOOL_KEY},{onConflict:'key'});}catch(e){}}
const WB_TABS={health:'tabHealth',create:'tabCreate',edit:'tabEdit',jobs:'tabJobs',schemas:'tabSchemas',backfill:'tabBackfill'};

/* ═══ load ═══ */
/* REG S76-01 (CM): PostgREST caps a page at 1000 rows silently — paginate every full-table read */
async function sbFetchAll(mk,ps=1000){let all=[],off=0;for(;;){const{data,error}=await mk().range(off,off+ps-1);if(error)throw error;if(!data||!data.length)break;all=all.concat(data);if(data.length<ps)break;off+=ps;}return all;}
async function wbLoadItems(){H.items=await sbFetchAll(()=>sbClient.from('items').select('id,sku,product_name,is_active,wayfair_sku,wayfair_class_id,wayfair_listing_id,wayfair_status,wayfair_status_at').order('id',{ascending:true}));}
async function wbCounts(){const a=await sbClient.from('items').select('id',{count:'exact',head:true});const b=await sbClient.from('items').select('id',{count:'exact',head:true}).not('wayfair_sku','is',null).neq('wayfair_sku','');const c=await sbClient.from('items').select('id',{count:'exact',head:true}).not('wayfair_listing_id','is',null);for(const r of[a,b,c])if(r.error)throw r.error;return{total:a.count,sku:b.count,listing:c.count,at:new Date().toISOString()};}
/* v0.1.1: the browser pages through catalog.read itself (3 pages in flight, 3 tries each).
   One all:true call ran ~10 pages × ~12 s inside a single Apps Script web-app request, which Google cut
   off with a non-JSON HTTP 404 (live test 2026-09-25). Each page is now its own short call. */
async function wbReadAllPages(onProg){const first=await wbRead('catalog.read',{view:'summary',pageSize:30,page:1});const d1=first.data||{};const pg=d1.pagination||{};const total=Math.max(1,pg.totalPages||1);const byPage={1:d1.items||[]};let done=1;if(onProg)onProg(done,total);const queue=[];for(let p=2;p<=total;p++)queue.push(p);
const worker=async()=>{while(queue.length){const p=queue.shift();let tries=0;for(;;){try{const r=await wbRead('catalog.read',{view:'summary',pageSize:30,page:p});byPage[p]=(r.data&&r.data.items)||[];break;}catch(e){if(++tries>=3)throw new Error('Page '+p+' of '+total+': '+e.message);await new Promise(x=>setTimeout(x,2000*tries));}}done++;if(onProg)onProg(done,total);}};
await Promise.all([worker(),worker(),worker()]);const items=[];for(let p=1;p<=total;p++)items.push(...(byPage[p]||[]));
const truncated=pg.totalCount!=null&&items.length<pg.totalCount;return{items,count:items.length,pagesRead:total,truncated,pagination:{totalCount:pg.totalCount,totalPages:total},supplier:d1.supplier||null,env:first.env,version:first.version};}
async function wbLoadAll(){if(H.loading)return;H.loading=true;H.err=null;BF.plan=null;BF.result=null;BF.verify=null;hBanner('info','Reading items from Supabase and the catalog from Wayfair (Read v2, all pages)… this can take 20–40 s.');try{await wfLoadUrl();await wbLoadItems();if(!H.baseline)H.baseline=await wbCounts();const r=await wbReadAllPages((a,b)=>hBanner('info',`Reading the catalog from Wayfair (Read v2)… page ${a} of ${b}`));const d=r;H.wf=Array.isArray(d.items)?d.items:[];H.meta={count:d.count,pagesRead:d.pagesRead,truncated:!!d.truncated,total:d.pagination&&d.pagination.totalCount,supplier:d.supplier||null,env:r.env,version:r.version};H.readAt=new Date().toISOString();hBuild();H.snap=await snapSaveSummary(H.wf);wbLog('WF_WORKBENCH_HEALTH_LOADED',`Health: ${H.wf.length} Wayfair parts (${r.env}) · ${hCount('matched')} matched · ${hCount('wfOnly')} on Wayfair not in items · ${hCount('itemsOnly')} in items not on Wayfair`,{env:r.env,proxy_version:r.version,wayfair_parts:H.wf.length,pages:d.pagesRead,truncated:!!d.truncated,matched:hCount('matched'),wf_only:hCount('wfOnly'),items_only:hCount('itemsOnly'),snapshot:H.snap,wb_version:WB_VERSION});}catch(e){H.err=e.message||String(e);wbLog('WF_WORKBENCH_HEALTH_FAILED',H.err.slice(0,300),{error:H.err,wb_version:WB_VERSION});}finally{H.loading=false;}hRender();bfRender();}
function hBanner(cls,html){const b=document.getElementById('hBanner');if(b)b.innerHTML=`<div class="banner ${cls}">${html}</div>`;}

/* ═══ join (exact supplierPartNumber = items.wayfair_sku) ═══ */
/* hint only: the Wayfair part number ends with (one of) the items value(s), e.g. 13636A ↔ CCDKK13636A. Live test 2026-09-25 found 9 such items. */
function wbSuffixOf(spn,sku){const n=wbNorm(spn);return String(sku||'').split('/').map(wbNorm).some(p=>p.length>=4&&n.length>p.length&&n.endsWith(p)&&n.startsWith('CCD'));}
function wbNorm(s){return String(s||'').toUpperCase().replace(/[\s\-_.\/]/g,'');}
function hBuild(){const bySku={},byNormWfSku={},byNormSku={};H.items.forEach(i=>{const k=i.wayfair_sku;if(k!=null&&k!==''){(bySku[k]=bySku[k]||[]).push(i);(byNormWfSku[wbNorm(k)]=byNormWfSku[wbNorm(k)]||[]).push(i);}if(i.sku)(byNormSku[wbNorm(i.sku)]=byNormSku[wbNorm(i.sku)]||[]).push(i);});
const wfBy={},byNormSpn={},lp={};H.wf.forEach(w=>{const s=String(w.supplierPartNumber||'');(wfBy[s]=wfBy[s]||[]).push(w);(byNormSpn[wbNorm(s)]=byNormSpn[wbNorm(s)]||[]).push(s);(w.listingIds||[]).forEach(l=>{(lp[l]=lp[l]||new Set()).add(s);});});
const rows=[];
for(const spn of Object.keys(wfBy)){const ws=wfBy[spn],w=ws[0],its=bySku[spn]||[];const lids=Array.isArray(w.listingIds)?w.listingIds.filter(Boolean):[];const sib=new Set();lids.forEach(l=>(lp[l]||new Set()).forEach(x=>{if(x!==spn)sib.add(x);}));
let hint=null;if(!its.length){const c=[...(byNormWfSku[wbNorm(spn)]||[]).map(i=>({item:i,why:'wayfair_sku differs only in case/spacing/dashes'})),...(byNormSku[wbNorm(spn)]||[]).filter(i=>!i.wayfair_sku).map(i=>({item:i,why:'item SKU matches, but its wayfair_sku is empty'})),...H.items.filter(i=>i.wayfair_sku&&!wfBy[i.wayfair_sku]&&wbSuffixOf(spn,i.wayfair_sku)).map(i=>({item:i,why:'wayfair_sku is this part number without its CCD prefix'}))];if(c.length)hint=c;}
rows.push({spn,w,its,dupWf:ws.length>1,bucket:its.length?'matched':'wfOnly',status:w.status||null,lids,siblings:[...sib],classWf:w.classId!=null?String(w.classId):'',className:w.className||'',classIt:its[0]?String(its[0].wayfair_class_id||'').trim():'',ins:w.insightCounts||{problems:0,warnings:0,opportunities:0},insIds:Array.isArray(w.insightTypeIds)?w.insightTypeIds:[],hint});}
for(const sku of Object.keys(bySku)){if(wfBy[sku])continue;const its=bySku[sku];const c=[...(byNormSpn[wbNorm(sku)]||[]).map(s=>({spn:s,why:'a Wayfair part number differs only in case/spacing/dashes'})),...Object.keys(wfBy).filter(s=>!bySku[s]&&wbSuffixOf(s,sku)).map(s=>({spn:s,why:'this wayfair_sku is the Wayfair part number without its CCD prefix'}))];rows.push({spn:sku,w:null,its,dupWf:false,bucket:'itemsOnly',status:null,lids:[],siblings:[],classWf:'',className:'',classIt:String(its[0].wayfair_class_id||'').trim(),ins:{problems:0,warnings:0,opportunities:0},insIds:[],hint:c.length?c:null});}
rows.forEach(r=>{r.classMismatch=r.bucket==='matched'&&r.classWf&&r.classIt&&r.classWf!==r.classIt;r.classMissing=r.bucket==='matched'&&!r.classIt;r.hasIns=(r.ins.problems||0)+(r.ins.warnings||0)+(r.ins.opportunities||0)>0||r.insIds.length>0;});
rows.sort((a,b)=>a.spn.localeCompare(b.spn));H.rows=rows;
const types=new Set();rows.forEach(r=>r.insIds.forEach(t=>types.add(t)));const sel=document.getElementById('hIns');const cur=H.f.ins;sel.innerHTML='<option value="">Any insight type</option>'+[...types].sort((a,b)=>insLabel(a).localeCompare(insLabel(b))).map(t=>`<option value="${escA(t)}" ${t===cur?'selected':''}>${esc(insBucketName(t))}: ${esc(insLabel(t))} (${rows.filter(r=>r.insIds.includes(t)).length})</option>`).join('');}
/* insightTypeIds look like "w:productPerformance.missingRecommendedAttributes" — prefix = bucket (contract 3.2) */
function insBucketName(t){return{p:'problem',w:'warning',o:'opportunity'}[String(t).charAt(0)]||'insight';}

/* ═══ Health render ═══ */
function hSet(k,v){H.f[k]=v;H.page=1;hRender();}
let hQTimer=null;function hSetQ(v){clearTimeout(hQTimer);hQTimer=setTimeout(()=>hSet('q',v),200);}

function hFilter(){const f=H.f,q=f.q.toLowerCase().trim();return H.rows.filter(r=>{if(f.bucket!=='all'&&r.bucket!==f.bucket)return false;if(f.status==='-'){if(r.w)return false;}else if(f.status&&r.status!==f.status)return false;if(f.flag==='classMismatch'&&!r.classMismatch)return false;if(f.flag==='classMissing'&&!r.classMissing)return false;if(f.flag==='insights'&&!r.hasIns)return false;if(f.flag==='problems'&&!(r.ins.problems>0))return false;if(f.flag==='shared'&&!r.siblings.length)return false;if(f.flag==='multiListing'&&!(r.lids.length>1))return false;if(f.flag==='hint'&&!r.hint)return false;if(f.ins&&!r.insIds.includes(f.ins))return false;if(q){const hay=[r.spn,r.lids.join(' '),r.className,...r.its.map(i=>`${i.sku} ${i.product_name}`)].join(' ').toLowerCase();if(!hay.includes(q))return false;}return true;});}
function stBadge(s){if(!s)return '<span class="badge b-none">not on Wayfair</span>';const c=s==='LIVE'?'b-live':s==='NOT_LIVE'?'b-notlive':s==='LAUNCHING'?'b-launch':'b-warn';return `<span class="badge ${c}">${esc(s)}</span>`;}

function hRender(){const env=H.meta&&H.meta.env;
if(H.err){hBanner('err',`<b>Could not load.</b> ${esc(H.err)}${/HTTP 40[35]|JSON/.test(H.err)?'<br>Check that the web app is deployed with Execute as <b>me</b> and Access <b>Anyone</b>, and that settings.proxy_urls.wayfair_catalog is its /exec URL.':''}`);}
else if(H.loading){/* banner already set */}
else if(H.meta){const warn=[];if(env!=='production')warn.push(`The proxy is on <b>${esc(env||'?')}</b>. The sandbox mirrors the live catalog, but the <b>snapshot and the backfill only run against production</b> (S18.2: switchToProduction() → redeploy the same deployment → viewConfig()).`);if(H.meta.truncated)warn.push('<b>The read was truncated</b> at the proxy page cap; counts are incomplete. Do not backfill.');if(H.meta.total!=null&&H.meta.total!==H.wf.length)warn.push(`Wayfair reports ${H.meta.total} items but ${H.wf.length} came back.`);const dups=H.rows.filter(r=>r.dupWf).length;if(dups)warn.push(`${dups} part number(s) came back more than once from Wayfair.`);
hBanner(warn.length?'warn':'ok',`Read ${H.wf.length} part numbers from Wayfair (${esc(env)} · ${H.meta.pagesRead||'?'} page(s)) at ${esc(new Date(H.readAt).toLocaleTimeString())} · items: ${H.items.length} rows, ${H.items.filter(i=>i.wayfair_sku).length} with wayfair_sku${H.snap?` · snapshot: ${H.snap.saved!=null?H.snap.saved+' rows saved':esc(H.snap.note||'')}`:''}${warn.length?'<br>'+warn.join('<br>'):''}`);}

/* ═══ Channel ID backfill ═══════════════════════════════════════════════════
   Match: items.wayfair_sku === Read v2 supplierPartNumber, EXACTLY. Nothing else.
   Write: wayfair_listing_id, wayfair_status, wayfair_status_at on that items row only.
   Never: write wayfair_sku; read wayfair_listing_id to choose a row (WF-053); pre-seed items not on
   Wayfair; clear a listing ID (a part that left Wayfair is reported, not changed). */
function bfBuild(){const plan=[],skips=[];for(const r of H.rows){if(r.bucket!=='matched')continue;const base={spn:r.spn,status:r.status};
if(r.its.length>1){skips.push({...base,why:`${r.its.length} items rows share this wayfair_sku`});continue;}
if(r.dupWf){skips.push({...base,why:'Wayfair returned this part number more than once'});continue;}
if(r.lids.length!==1){skips.push({...base,why:r.lids.length?`${r.lids.length} listing IDs (${r.lids.join(', ')}) — decide by hand`:'Wayfair returned no listing ID'});continue;}
const it=r.its[0],cur=it.wayfair_listing_id||null,prop=r.lids[0];const okSt=WB_STATUSES.includes(r.status);
const act=cur==null?'set':cur===prop?'same':'change';const stChange=okSt&&it.wayfair_status!==r.status;
plan.push({spn:r.spn,itemId:it.id,itemSku:it.sku,cur,prop,act,curStatus:it.wayfair_status||null,status:okSt?r.status:null,stChange,badStatus:!okSt&&r.status?r.status:null,shared:r.siblings.length});}
const matchedSpns=new Set(plan.map(p=>p.spn));const stale=H.items.filter(i=>i.wayfair_listing_id&&!H.rows.some(r=>r.bucket==='matched'&&r.its.includes(i))).map(i=>({sku:i.sku,wayfair_sku:i.wayfair_sku,lid:i.wayfair_listing_id}));
BF.plan={plan,skips,stale,readAt:H.readAt,env:H.meta&&H.meta.env,builtAt:new Date().toISOString()};return BF.plan;}
function bfN(a){return BF.plan?BF.plan.plan.filter(p=>p.act===a).length:0;}
function bfRender(){const box=document.getElementById('bfBody');if(!box)return;if(H.loading){box.innerHTML='<div class="muted">Loading…</div>';return;}if(H.err||!H.meta){box.innerHTML=`<div class="banner ${H.err?'err':'info'}">${H.err?esc(H.err):'Load from Wayfair first.'}</div>`;return;}
if(!BF.plan||BF.plan.readAt!==H.readAt)bfBuild();const P=BF.plan;const prod=wbIsProd()&&P.env==='production';const trunc=H.meta.truncated;const age=(Date.now()-new Date(H.readAt).getTime())/60000;const fresh=age<30;
const toWrite=P.plan.filter(p=>p.act!=='same'||p.stChange||p.status);const nWrites=P.plan.length;
const gate=!prod?'The proxy is not on production. Switch it (S18.2), reload, then apply.':trunc?'The Wayfair read was truncated. Reload before applying.':!fresh?`The Wayfair read is ${Math.round(age)} min old. Reload before applying.`:BF.running?'Running…':null;
const card=(l,v,s,c)=>`<div class="stat-card" style="cursor:default"><div class="stat-label">${l}</div><div class="stat-value" style="color:${c}">${v}</div><div class="stat-sub">${s}</div></div>`;
const rowsHtml=P.plan.filter(p=>p.act!=='same'||p.stChange).map(p=>`<tr><td class="sku">${esc(p.spn)}</td><td class="mono">${esc(p.itemSku)}</td><td class="mono">${p.cur?esc(p.cur):'<span class="muted">∅</span>'}</td><td class="mono">${esc(p.prop)}${p.shared?` <span class="badge b-purple">+${p.shared}</span>`:''}</td><td><span class="badge ${p.act==='set'?'b-live':p.act==='change'?'b-warn':'b-none'}">${p.act}</span></td><td>${p.curStatus?esc(p.curStatus):'<span class="muted">∅</span>'} → ${p.status?stBadge(p.status):(p.badStatus?`<span class="badge b-warn" title="not LIVE/NOT_LIVE/LAUNCHING — status left as is">${esc(p.badStatus)}</span>`:'—')}</td></tr>`).join('');
const skipHtml=P.skips.map(s=>`<tr><td class="sku">${esc(s.spn)}</td><td>${stBadge(s.status)}</td><td class="wrap">${esc(s.why)}</td></tr>`).join('');
const wfOnly=H.rows.filter(r=>r.bucket==='wfOnly'),itOnly=H.rows.filter(r=>r.bucket==='itemsOnly');
const res=BF.result?`<div class="banner ${BF.result.failed||BF.result.stale?'warn':'ok'}"><b>Applied ${esc(new Date(BF.result.at).toLocaleTimeString())}:</b> ${BF.result.written} rows written (${BF.result.set} set, ${BF.result.changed} changed, ${BF.result.statusOnly} status only) · ${BF.result.stale} skipped because the row changed since the read · ${BF.result.failed} failed.${BF.result.errors.length?'<div class="log">'+BF.result.errors.map(esc).join('<br>')+'</div>':''}</div>`:'';
const ver=BF.verify?`<div class="banner ${BF.verify.pass?'ok':'err'}"><b>Verify ${BF.verify.pass?'PASSED':'FAILED'}</b> — ${BF.verify.lines.map(esc).join(' · ')}</div>`:'';
box.innerHTML=`<div class="banner info"><b>Dry run.</b> Proposed from the Wayfair read at ${esc(new Date(H.readAt).toLocaleString())} (${esc(P.env)}). A row is proposed <b>only</b> where items.wayfair_sku exactly equals a Wayfair supplierPartNumber. wayfair_sku is never written; the listing ID is never used to find a row (WF-053); nothing is written for items not on Wayfair.</div>
<div class="stats-bar">${card('Matched & eligible',nWrites,'one items row, one listing ID','var(--green)')}${card('Listing ID to set',bfN('set'),'currently empty','var(--green)')}${card('Listing ID to change',bfN('change'),'currently different — check these','var(--yellow)')}${card('Already correct',bfN('same'),`${P.plan.filter(p=>p.act==='same'&&p.stChange).length} of them get a status update`,'var(--text2)')}${card('Skipped',P.skips.length,'need a human decision','var(--red)')}${card('Has a listing ID, not matched',P.stale.length,'reported, never cleared','var(--muted)')}</div>
${res}${ver}
<div class="sec"><div class="sec-h">Apply <span class="muted" style="font-weight:400;">writes ${nWrites} items rows: listing ID + status + status time (${esc(new Date(H.readAt).toLocaleTimeString())})</span></div>${gate?`<div class="banner warn">${esc(gate)}</div>`:''}<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;"><button class="btn primary" onclick="bfApply()" ${gate||!nWrites?'disabled':''}>Apply to ${nWrites} items rows</button><button class="btn" onclick="bfVerify()" ${BF.running?'disabled':''}>Verify now</button><span class="muted small" id="bfProg"></span></div><div class="progress"><div id="bfBar"></div></div></div>
<div class="sec"><div class="sec-h">Proposed changes (${P.plan.filter(p=>p.act!=='same'||p.stChange).length}) <span class="muted" style="font-weight:400;">rows that are already correct are hidden</span></div><div class="table-wrap" style="max-height:420px;overflow-y:auto;"><table><thead><tr><th>Part #</th><th>Item SKU</th><th>Current listing ID</th><th>Proposed</th><th>Action</th><th>Status</th></tr></thead><tbody>${rowsHtml||'<tr><td colspan="6" class="muted">Nothing to change.</td></tr>'}</tbody></table></div></div>
${P.skips.length?`<div class="sec"><div class="sec-h">Skipped (${P.skips.length})</div><div class="table-wrap"><table><thead><tr><th>Part #</th><th>Status</th><th>Why</th></tr></thead><tbody>${skipHtml}</tbody></table></div></div>`:''}
${P.stale.length?`<div class="sec"><div class="sec-h">Items with a listing ID that did not match this read (${P.stale.length})</div><div class="muted small">Left exactly as they are. A part that left Wayfair keeps its old listing ID until someone decides otherwise.</div><div class="mono small" style="margin-top:6px;">${P.stale.map(s=>esc(s.sku+' ('+s.wayfair_sku+') → '+s.lid)).join('<br>')}</div></div>`:''}
<div class="sec"><div class="sec-h">Unmatched lists for Paul and Mary <span class="muted" style="font-weight:400;">typos vs items missing from inventory</span></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;"><button class="btn" onclick="bfCsv('wfOnly')">⬇ On Wayfair, not in items (${wfOnly.length}) CSV</button><button class="btn" onclick="bfCsv('itemsOnly')">⬇ In items, not on Wayfair (${itOnly.length}) CSV</button></div><div class="muted small">Each row carries a “possible match” hint where one exists (case, spaces, dashes, or an item SKU equal to the part number with an empty wayfair_sku). Hints are for the humans only; nothing is matched on them.</div></div>
<div class="sec"><div class="sec-h">Verification SQL (paste into the Supabase SQL editor)</div><pre class="sql">${esc(bfSql())}</pre></div>`;}
function bfSql(){return `-- S18.5 backfill verification (read-only)
SELECT 'rows_total' AS k, count(*)::text AS v FROM items
UNION ALL SELECT 'rows_with_wayfair_sku', count(*)::text FROM items WHERE wayfair_sku IS NOT NULL AND wayfair_sku <> ''
UNION ALL SELECT 'rows_with_listing_id',  count(*)::text FROM items WHERE wayfair_listing_id IS NOT NULL
UNION ALL SELECT 'listing_id_without_wayfair_sku (must be 0)', count(*)::text FROM items WHERE wayfair_listing_id IS NOT NULL AND (wayfair_sku IS NULL OR wayfair_sku = '')
UNION ALL SELECT 'listing_id_but_not_in_snapshot', count(*)::text FROM items i WHERE i.wayfair_listing_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM wayfair_catalog_snapshot s WHERE s.supplier_part_number = i.wayfair_sku)
UNION ALL SELECT 'listing_id_disagrees_with_snapshot (must be 0)', count(*)::text FROM items i JOIN wayfair_catalog_snapshot s ON s.supplier_part_number = i.wayfair_sku WHERE i.wayfair_listing_id IS NOT NULL AND NOT (i.wayfair_listing_id = ANY (s.listing_ids))
UNION ALL SELECT 'shared_listings (many-to-one, expected > 0)', count(*)::text FROM (SELECT wayfair_listing_id FROM items WHERE wayfair_listing_id IS NOT NULL GROUP BY 1 HAVING count(*) > 1) x
UNION ALL SELECT 'status_'||coalesce(wayfair_status,'null'), count(*)::text FROM items WHERE wayfair_sku IS NOT NULL AND wayfair_sku <> '' GROUP BY wayfair_status
ORDER BY 1;
-- Expect: rows_with_wayfair_sku unchanged from before (${H.baseline?H.baseline.sku:'?'}); rows_with_listing_id = matched & eligible (${BF.plan?BF.plan.plan.length:'?'}) + any pre-existing unmatched.`;}
async function bfApply(){const P=BF.plan;if(!P||BF.running)return;if(!wbIsProd()||P.env!=='production'){alert('The proxy is not on production.');return;}const n=P.plan.length;if(!confirm(`Write the Wayfair listing ID and status to ${n} items rows?\n\n• ${bfN('set')} listing IDs set (currently empty)\n• ${bfN('change')} listing IDs changed (currently different)\n• ${bfN('same')} already correct (status refreshed)\n• ${P.skips.length} skipped\n\nOnly rows whose wayfair_sku exactly equals a Wayfair part number are touched. wayfair_sku is not written.`))return;
BF.running=true;bfRender();const t0=Date.now();const res={at:null,written:0,set:0,changed:0,statusOnly:0,stale:0,failed:0,errors:[]};const bar=()=>document.getElementById('bfBar'),prog=()=>document.getElementById('bfProg');let done=0;
const one=async p=>{const upd={wayfair_listing_id:p.prop,wayfair_status_at:P.readAt};if(p.status)upd.wayfair_status=p.status;
/* guards: the primary key, the exact part number we matched on, and the listing ID we read (optimistic) */
let q=sbClient.from('items').update(upd).eq('id',p.itemId).eq('wayfair_sku',p.spn);q=p.cur==null?q.is('wayfair_listing_id',null):q.eq('wayfair_listing_id',p.cur);
const{data,error}=await q.select('id');if(error){res.failed++;res.errors.push(`${p.spn}: ${error.message}`);}else if(!data||!data.length){res.stale++;res.errors.push(`${p.spn}: row changed since the read — skipped`);}else{res.written++;if(p.act==='set')res.set++;else if(p.act==='change')res.changed++;else res.statusOnly++;}done++;const b=bar();if(b)b.style.width=Math.round(done/n*100)+'%';const g=prog();if(g)g.textContent=`${done} / ${n}`;};
const queue=P.plan.slice();const workers=[];for(let k=0;k<4;k++)workers.push((async()=>{while(queue.length){await one(queue.shift());}})());await Promise.all(workers);
res.at=new Date().toISOString();BF.result=res;BF.running=false;
wbLog('WAYFAIR_LISTING_ID_BACKFILL',`Channel ID backfill: ${res.written} items rows written (${res.set} set, ${res.changed} changed, ${res.statusOnly} status only), ${res.stale} changed-since-read, ${res.failed} failed, ${P.skips.length} skipped; ${H.rows.filter(r=>r.bucket==='wfOnly').length} on Wayfair not in items, ${H.rows.filter(r=>r.bucket==='itemsOnly').length} in items not on Wayfair`,{wayfair_read_at:P.readAt,env:P.env,proxy_version:H.meta.version,wayfair_parts:H.wf.length,eligible:n,written:res.written,set:res.set,changed:res.changed,status_only:res.statusOnly,stale:res.stale,failed:res.failed,skipped:P.skips.map(s=>({spn:s.spn,why:s.why})),wf_only:H.rows.filter(r=>r.bucket==='wfOnly').length,items_only:H.rows.filter(r=>r.bucket==='itemsOnly').length,changed_rows:P.plan.filter(p=>p.act==='change').map(p=>({spn:p.spn,from:p.cur,to:p.prop})),errors:res.errors.slice(0,50),ms:Date.now()-t0,wb_version:WB_VERSION});
await bfVerify(true);}
async function bfVerify(after){const P=BF.plan;try{await wbLoadItems();const c=await wbCounts();const lines=[];let pass=true;
if(H.baseline){const ok=c.sku===H.baseline.sku;pass=pass&&ok;lines.push(`wayfair_sku count ${c.sku} (before ${H.baseline.sku}) ${ok?'✓':'✗ CHANGED'}`);}
if(c.total!=null&&H.baseline){lines.push(`items rows ${c.total} (before ${H.baseline.total})`);}
if(P){const byId={};H.items.forEach(i=>{byId[i.id]=i;});const wrong=P.plan.filter(p=>{const i=byId[p.itemId];return !i||i.wayfair_listing_id!==p.prop||i.wayfair_sku!==p.spn;});const okAll=!wrong.length;pass=pass&&okAll;lines.push(`${P.plan.length-wrong.length} of ${P.plan.length} eligible rows carry the proposed listing ID ${okAll?'✓':'✗ ('+wrong.slice(0,5).map(p=>p.spn).join(', ')+(wrong.length>5?'…':'')+')'}`);
const orphan=H.items.filter(i=>i.wayfair_listing_id&&!i.wayfair_sku).length;pass=pass&&!orphan;lines.push(`listing ID without wayfair_sku: ${orphan} ${orphan?'✗':'✓'}`);lines.push(`rows with a listing ID: ${c.listing}`);}
BF.verify={pass,lines,at:new Date().toISOString()};if(after)wbLog('WAYFAIR_LISTING_ID_BACKFILL_VERIFY',`Backfill verify ${pass?'PASSED':'FAILED'}: ${lines.join(' · ')}`,{pass,lines,counts:c,baseline:H.baseline,wb_version:WB_VERSION});hBuild();}catch(e){BF.verify={pass:false,lines:['verify failed: '+(e.message||e)]};}bfRender();hRender();}
function bfCsv(which){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';let head,rows;if(which==='wfOnly'){head=['supplierPartNumber','status','listingIds','classId','className','possible_match','why'];rows=H.rows.filter(r=>r.bucket==='wfOnly').map(r=>[r.spn,r.status,r.lids.join(' '),r.classWf,r.className,(r.hint||[]).map(h=>h.item?h.item.sku:'').join(' '),(r.hint||[]).map(h=>h.why).join(' | ')]);}else{head=['wayfair_sku','item_sku','product_name','is_active','wayfair_class_id','possible_wayfair_match','why'];rows=H.rows.filter(r=>r.bucket==='itemsOnly').map(r=>{const i=r.its[0];return[r.spn,i.sku,i.product_name,i.is_active,i.wayfair_class_id,(r.hint||[]).map(h=>h.spn).join(' '),(r.hint||[]).map(h=>h.why).join(' | ')];});}
const csv=[head,...rows].map(a=>a.map(q).join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`wayfair-${which==='wfOnly'?'on-wayfair-not-in-items':'in-items-not-on-wayfair'}-${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

/* ═══ class schema (taxonomy.attributes) — cache first; Plan B = sandbox-sourced copies, labelled ═══
   wayfair_attribute_schemas.schema carries _meta {source:'production'|'sandbox', proxyVersion, wbVersion, fetchedAt}.
   Rows written before v0.2 have no _meta and count as production. A sandbox copy never overwrites a production one.
   When the proxy is on production and the cached copy is sandbox-sourced, the live schema is tried first
   (Taxonomy Attributes Read may have opened); on success the production copy replaces the sandbox one. */
const SCH={};
function schMeta(s){return (s&&s._meta)||{};}
function schSrcOf(s){return schMeta(s).source||'production';}
function schPack(cid,schema,source,fetchedAt,extra){const ids=new Set();const walk=a=>(a||[]).forEach(x=>{if(x&&x.id!=null)ids.add(String(x.id));walk(x&&x.children);});walk(schema&&schema.attributes);return{cid,schema,ids,source:source||'production',fetchedAt:fetchedAt||null,note:`Class ${cid} schema: ${ids.size} attribute IDs (${source==='sandbox'?'SANDBOX-sourced copy, Plan B':'production'}${fetchedAt?' · '+new Date(fetchedAt).toLocaleDateString():''})${extra?' — '+extra:''}.`};}
async function schSave(cid,data,env,ver,cachedSchema){const src=env==='production'?'production':'sandbox';data._meta={source:src,proxyVersion:ver||null,wbVersion:WB_VERSION,fetchedAt:new Date().toISOString()};if(src==='sandbox'&&cachedSchema&&schSrcOf(cachedSchema)==='production')return{saved:false,why:'a production copy is cached'};const{error}=await sbClient.from('wayfair_attribute_schemas').upsert({class_id:cid,market:'WAYFAIR_US',schema:data,fetched_at:data._meta.fetchedAt},{onConflict:'class_id,market'});if(error){console.warn('[schema cache]',error.message);return{saved:false,why:error.message};}return{saved:true,source:src};}
async function schCached(cid){try{const{data}=await sbClient.from('wayfair_attribute_schemas').select('schema,fetched_at').eq('class_id',cid).eq('market','WAYFAIR_US').limit(1);if(data&&data[0])return{schema:data[0].schema,fetchedAt:data[0].fetched_at};}catch(e){}return null;}
async function wbSchema(classId,force){const cid=classNum(classId);if(cid==null)return{cid:null,schema:null,ids:null,source:null,note:'No class ID, so there is no class schema.'};if(SCH[cid]&&!force)return SCH[cid];
const cached=await schCached(cid);const cSrc=cached?schSrcOf(cached.schema):null;
const tryLive=!cached||(cSrc==='sandbox'&&wbIsProd())||(force&&!(cSrc==='production'&&!wbIsProd()));let live=null,liveEnv=null,liveErr=null;
if(tryLive){try{const r=await wbRead('taxonomy.attributes',{classId:String(cid)});if(r.data&&Array.isArray(r.data.attributes)){live=r.data;liveEnv=r.env;await schSave(cid,live,r.env,r.version,cached&&cached.schema);}}catch(e){liveErr=e.message||String(e);}}
let res;if(live)res=schPack(cid,live,liveEnv==='production'?'production':'sandbox',live._meta&&live._meta.fetchedAt,null);
else if(cached)res=schPack(cid,cached.schema,cSrc,cached.fetchedAt,liveErr&&cSrc==='sandbox'&&wbIsProd()?'production taxonomy.attributes still fails ('+liveErr+'), so the sandbox copy is used':null);
else res={cid,schema:null,ids:null,source:null,note:'Class schema not available ('+(liveErr||'?')+'). In production this usually means Taxonomy Attributes Read is still locked. Import the schemas from the sandbox on the 📐 Schemas tab (Plan B); until then attributes are read-only (Plan C).'};
return(SCH[cid]=res);}
async function dSchema(classId){return wbSchema(classId);}

/* ═══ 📐 Schemas tab — Plan B import ═══ */
const SC={rows:[],busy:false,prog:'',log:[],err:null};
async function scLoad(){try{const{data,error}=await sbClient.from('wayfair_attribute_schemas').select('class_id,fetched_at,meta:schema->_meta,count:schema->count').eq('market','WAYFAIR_US');if(error)throw error;SC.rows=data||[];SC.err=null;}catch(e){SC.err=e.message||String(e);}scRender();}
function scClasses(){const by={};H.rows.filter(r=>r.bucket==='matched'&&r.classWf).forEach(r=>{const c=r.classWf;(by[c]=by[c]||{cid:c,name:r.className||'',parts:0}).parts++;});SC.rows.forEach(s=>{const c=String(s.class_id);if(!by[c])by[c]={cid:c,name:'',parts:0};});return Object.values(by).sort((a,b)=>b.parts-a.parts||Number(a.cid)-Number(b.cid));}
function scRow(cid){return SC.rows.find(s=>String(s.class_id)===String(cid))||null;}
function scRender(){const box=document.getElementById('scBody');if(!box)return;const cls=scClasses();const env=WB.env||'?';const nC=cls.filter(c=>scRow(c.cid)).length;
box.innerHTML=`<div class="banner info"><b>Class schemas</b> drive the Edit attribute form (WF-045). Production <b>Taxonomy Attributes Read</b> is <b>open</b> (2026-10-02, WF-060): import from production. Older copies imported from the <b>sandbox</b> (Plan B) are labelled <span class="badge b-warn">sandbox</span>; replace them with the button below. A sandbox copy never replaces a production one, and a production read replaces a sandbox copy as soon as the scope opens. Wayfair validates every change anyway.<br>The proxy is on <b>${esc(env)}</b>. Import runs through the proxy's current environment: switch it to sandbox in the GAS editor (switchToSandbox → redeploy) to run Plan B.</div>
${SC.err?`<div class="banner err">${esc(SC.err)}</div>`:''}
<div class="sec"><div class="sec-h">${nC} of ${cls.length} classes cached <span class="muted" style="font-weight:400;">(classes of matched parts, plus anything already cached)</span></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;"><button class="btn primary" onclick="scImport('missing')" ${SC.busy||!WB.env?'disabled':''}>Import missing (${cls.length-nC}) from ${esc(env)}</button><button class="btn" onclick="scImport('all')" ${SC.busy||!WB.env?'disabled':''}>Refresh all from ${esc(env)}</button><button class="btn ${SC.rows.some(r=>r.meta&&r.meta.source==='sandbox')?'primary':''}" onclick="scImport('sbxonly')" ${SC.busy||WB.env!=='production'?'disabled':''}>Replace sandbox copies from production (${SC.rows.filter(r=>r.meta&&r.meta.source==='sandbox').length})</button><button class="btn" onclick="scImport('missing','sbx')" ${SC.busy?'disabled':''} title="Uses settings.proxy_urls.wayfair_catalog_sandbox — the production proxy is not switched">Import missing via the sandbox proxy</button><button class="btn" onclick="scLoad()" ${SC.busy?'disabled':''}>↻ Reload list</button><span class="muted small">${esc(SC.prog)}</span></div>
${SC.log.length?`<div class="log">${SC.log.map(esc).join('<br>')}</div>`:''}</div>
<div class="table-wrap"><table><thead><tr><th>Class</th><th>Name</th><th>Matched parts</th><th>Cached</th><th>Source</th><th>Attributes</th><th>Fetched</th></tr></thead><tbody>${cls.map(c=>{const s=scRow(c.cid);const src=s?((s.meta&&s.meta.source)||'production'):null;return `<tr><td class="mono">${esc(c.cid)}</td><td>${esc(c.name)}</td><td class="mono">${c.parts}</td><td>${s?'<span class="badge b-live">yes</span>':'<span class="badge b-none">no</span>'}</td><td>${src?`<span class="badge ${src==='sandbox'?'b-warn':'b-live'}">${esc(src)}</span>`:''}</td><td class="mono">${s&&s.count!=null?esc(s.count):''}</td><td class="small">${s?esc(new Date(s.fetched_at).toLocaleString()):''}</td></tr>`;}).join('')||'<tr><td colspan="7" class="muted">Load Health first.</td></tr>'}</tbody></table></div>`;}
async function scImport(mode,via){if(SC.busy)return;const useSbx=via==='sbx';if(useSbx){await sbxLoad();if(!SBX.url){alert('No sandbox proxy is set up (settings.proxy_urls.wayfair_catalog_sandbox).');return;}}else if(!WB.env){alert('The proxy environment is unknown. Reload from Wayfair first.');return;}const ENV=useSbx?'sandbox':WB.env;const cls=scClasses();const todo=cls.filter(c=>mode==='all'||(mode==='sbxonly'?((scRow(c.cid)||{}).meta||{}).source==='sandbox':!scRow(c.cid)));if(mode==='sbxonly'&&(useSbx||WB.env!=='production')){alert('Replacing sandbox copies needs the main proxy on production.');return;}if(!todo.length){SC.prog='Nothing to import.';scRender();return;}
if(!confirm(`${mode==='all'?'Refresh':'Import'} ${todo.length} class schema(s) from the ${useSbx?'SANDBOX proxy':'proxy\'s '+ENV.toUpperCase()+' environment'} into wayfair_attribute_schemas?${ENV!=='production'?'\n\nThey will be labelled sandbox-sourced (Plan B). Production copies are never replaced.':''}`))return;
SC.busy=true;SC.log=[];let ok=0,skip=0,fail=0;const t0=Date.now();
for(let i=0;i<todo.length;i++){const c=todo[i];SC.prog=`${i+1} / ${todo.length} · class ${c.cid}`;scRender();const cid=Number(c.cid);const cached=await schCached(cid);
if(ENV!=='production'&&cached&&schSrcOf(cached.schema)==='production'){skip++;SC.log.push(`${c.cid}: skipped — a production copy is cached`);continue;}
try{const r=useSbx?await sbxRead('taxonomy.attributes',{classId:String(cid)}):await wbRead('taxonomy.attributes',{classId:String(cid)});if(!r.data||!Array.isArray(r.data.attributes))throw new Error('no attributes in the answer');const sv=await schSave(cid,r.data,r.env,r.version,cached&&cached.schema);if(sv.saved){ok++;delete SCH[cid];SC.log.push(`${c.cid}: ${r.data.attributes.length} attributes saved (${sv.source})`);}else{skip++;SC.log.push(`${c.cid}: not saved — ${sv.why}`);}}catch(e){fail++;SC.log.push(`${c.cid}: ✗ ${e.message||e}`);}}
SC.busy=false;SC.prog=`Done: ${ok} saved, ${skip} skipped, ${fail} failed (${Math.round((Date.now()-t0)/1000)} s).`;
wbLog('WF_WORKBENCH_SCHEMA_IMPORT',`Schema import (${ENV}${useSbx?' via sandbox proxy':''}): ${ok} saved, ${skip} skipped, ${fail} failed of ${todo.length}`,{env:ENV,via:useSbx?'sandbox_proxy':'main',mode,saved:ok,skipped:skip,failed:fail,classes:todo.map(c=>c.cid),log:SC.log.slice(0,80),wb_version:WB_VERSION});
await scLoad();}

/* ═══ wayfair_jobs (one row per async Wayfair request) ═══ */
async function jInsert(row){const{data,error}=await sbClient.from('wayfair_jobs').insert(row).select('id');if(error)throw new Error('Could not record the job in wayfair_jobs: '+error.message);return data&&data[0]?data[0].id:null;}
async function jUpdate(id,patch){if(id==null)return;const{error}=await sbClient.from('wayfair_jobs').update(patch).eq('id',id);if(error)console.warn('[wayfair_jobs]',error.message);}
/* one update.status call → a compact result (WF-041: the proxy's outcome is authoritative; COMPLETED+problems = FAILED) */
async function wfUpdateStatus(requestId){const r=await wbRead('update.status',{requestId});const d=r.data||{};return{status:d.status||null,outcome:d.outcome||'UNKNOWN',problems:Array.isArray(d.problems)?d.problems:[],successfulUpdates:Array.isArray(d.successfulUpdates)?d.successfulUpdates:[],validationOnly:!!d.validationOnly};}
const E_POLL_S=[2,3,5,8,12,15,20,30,30,30,30,30,30];   /* ≈ 4 min; then the job stays open and Jobs can check it later */
let E_SLEEP=s=>new Promise(x=>setTimeout(x,s*1000));
/* poll until the outcome is not IN_PROGRESS. Never reports FAILED while Wayfair still says IN_PROGRESS (the Listing Editor image bug). */
async function wfPollUntilDone(res,onTick){let errs=0;for(let i=0;i<E_POLL_S.length;i++){await E_SLEEP(E_POLL_S[i]);res.polls=i+1;let s;try{s=await wfUpdateStatus(res.requestId);errs=0;}catch(e){if(++errs>=3){res.pollError=e.message||String(e);break;}continue;}res.status=s.status;res.outcome=s.outcome;res.problems=s.problems;res.successfulUpdates=s.successfulUpdates;if(onTick)onTick(res);if(s.outcome!=='IN_PROGRESS')return res;}if(!res.outcome||res.outcome==='IN_PROGRESS'){res.outcome='IN_PROGRESS';res.timedOut=true;}return res;}

if(d.items){if(d.items.supplierPartNumber!==E.spn)return'update.items must key on this part number.';for(const a of d.items.attributes||[]){const f=E.m.fields.find(x=>x.id===a.attributeId);if(!f||!E.sch.ids||!E.sch.ids.has(a.attributeId))return`Attribute ${a.attributeId} is not in the class schema; it is never sent (WF-045).`;if(f.locked)return`Attribute ${a.attributeId} is locked by Wayfair.`;if(!a.values.length)return`Attribute ${a.attributeId} has no values.`;}}
if(d.media&&d.media.some(x=>x.supplierPartNumber!==E.spn||eImgBad(x.mediaUrl)))return'update.media rows must key on this part number and use https JPG/PNG URLs.';
if(d.groups){const lids=(E.w.listingIds||[]).filter(Boolean);if(!E.g.ok||d.groups.itemGroupId!==E.item.wayfair_listing_id||lids.length!==1||lids[0]!==d.groups.itemGroupId)return'update.groups must use items.wayfair_listing_id, and only when it is the part\'s one listing (WF-049/053).';}
if(real&&!eValFresh(d))return`Submit needs a passing Validate of exactly these changes, on this environment, less than ${E_VALID_MAX_MIN} min old.`;return null;}

async function eSend(rq,d,real,onTick){const res={kind:rq.kind,action:rq.action,requestId:null,status:null,outcome:null,problems:[],successfulUpdates:[],error:null,jobId:null,polls:0};
const fields=d.rows.filter(r=>rq.kind==='update_groups'?r.level==='group':rq.kind==='update_media'?r.key==='media':(r.level==='part'&&r.key!=='media')).map(r=>r.field);
res.jobId=await jInsert({kind:rq.kind,validate_only:!real,status:'PENDING',payload:{env:WB.env,spn:E.spn,listing_id:rq.kind==='update_groups'?d.groups.itemGroupId:null,mode:real?'submit':'validate',fields,params:rq.params,wb_version:WB_VERSION}});
try{const r=await wbRead(rq.action,rq.params);res.requestId=r.data&&r.data.requestId||null;if(!res.requestId)throw new Error('The proxy returned no requestId (WF-003).');await jUpdate(res.jobId,{wayfair_request_id:res.requestId,status:'IN_PROGRESS'});}
catch(e){res.outcome='REJECTED';res.error=e.message||String(e);await jUpdate(res.jobId,{status:'REJECTED',completed_at:new Date().toISOString(),result:{outcome:'REJECTED',error:res.error,graphqlErrors:(e.envelope&&e.envelope.graphqlErrors)||null}});return res;}
if(onTick)onTick(res);await wfPollUntilDone(res,onTick);
const done=res.outcome!=='IN_PROGRESS';await jUpdate(res.jobId,Object.assign({result:{status:res.status,outcome:res.outcome,problems:res.problems,successfulUpdates:res.successfulUpdates,polls:res.polls,timedOut:!!res.timedOut,pollError:res.pollError||null}},done?{status:res.outcome,completed_at:new Date().toISOString()}:{status:'IN_PROGRESS'}));return res;}

async function eRun(mode){if(!E||!E.m||E.busy)return;const d=eDiff();const real=mode==='submit';const why=eWriteGuard(d,real);if(why){eFlash(why);return;}
const iw=mode==='validate'?false:true;
if(real){const L=[];if(d.items)L.push(`• update.items (${E.spn}): ${d.rows.filter(r=>r.level==='part'&&r.key!=='media').map(r=>r.field).join(', ')}`);if(d.groups)L.push(`• update.groups (listing ${d.groups.itemGroupId}${E.g.siblings.length?` — ALSO changes ${E.g.siblings.join(', ')}`:''}): ${d.rows.filter(r=>r.level==='group').map(r=>r.field).join(', ')}`);if(d.media)L.push(`• update.media (${E.spn}): ${d.media.length} image upload(s)`);
if(!confirm(`WRITE to Wayfair (${String(WB.env).toUpperCase()}) for ${E.spn}?\n\n${L.join('\n')}\n\nValidated ${new Date(E.lastVal.at).toLocaleTimeString()}${E.lastVal.ignoreWarnings?' (warnings ignored)':''}. This is a real write, not a dry run.`))return;}
E.busy=true;E.results=null;E.prog='Sending…';eRenderBar();const reqs=eReqs(d,!real,iw);const hash=eHash(d);const results=[];const t0=Date.now();
try{for(const rq of reqs){E.prog=`${rq.action} …`;eRenderBar();const res=await eSend(rq,d,real,x=>{E.prog=`${rq.action}: ${x.outcome||'sent'}${x.polls?` · poll ${x.polls}`:''}`;eRenderBar();});results.push(res);}}
catch(e){results.push({kind:'?',action:'?',outcome:'REJECTED',error:e.message||String(e),problems:[],successfulUpdates:[]});}
const pass=results.length===reqs.length&&results.every(x=>x.outcome==='SUCCEEDED');
if(!real)E.lastVal={hash,env:WB.env,at:Date.now(),pass,ignoreWarnings:iw,results};
E.results={mode,real,results,pass,at:new Date().toISOString(),ms:Date.now()-t0};E.prog='';
const sum=results.map(x=>`${x.action} ${x.outcome}${x.problems&&x.problems.length?` (${x.problems.length} problem${x.problems.length>1?'s':''})`:''}`).join(', ');
wbLog(real?'WF_WORKBENCH_EDIT_SUBMIT':'WF_WORKBENCH_EDIT_VALIDATE',`${real?'Submit':'Validate'}${iw&&!real?' (ignoring warnings)':''} ${E.spn} (${WB.env}): ${sum}`,{spn:E.spn,env:WB.env,listing_id:d.groups?d.groups.itemGroupId:null,siblings:d.groups?E.g.siblings:[],validate_only:!real,ignore_warnings:iw,fields_changed:d.rows.map(r=>({level:r.level,field:r.field,key:r.key,from:r.from,to:r.to,src:r.src})),requests:results.map(x=>({action:x.action,request_id:x.requestId,outcome:x.outcome,status:x.status,problems:x.problems,job_id:x.jobId,error:x.error||null})),pass,ms:Date.now()-t0,wb_version:WB_VERSION});
if(real&&results.some(x=>x.outcome==='SUCCEEDED'))await eReread(d);
E.busy=false;eRender();}

/* after a real write: read the part again, refresh the snapshot, and check each sent field against Wayfair */
async function eReread(d){try{E.prog='Re-reading the part from Wayfair…';eRenderBar();const q=await wbRead('catalog.read',{supplierPartNumbers:[E.spn],view:'full'});const w=((q.data&&q.data.items)||[]).find(x=>String(x.supplierPartNumber)===E.spn);if(!w)throw new Error('the part did not come back');await snapSaveFull(w);const before=E.m;const m2=eModel(w,E.sch,E.g.gid);
const rows=d.rows.map(r=>{let now=null,ok=null;if(r.key==='itemName'){now=[m2.content.itemName];ok=eSame(now,r.to);}else if(r.key==='marketingCopy'){now=[m2.content.marketingCopy];ok=eSame(now,r.to);}else if(r.key==='featureBullets'){const lb=m2.content.listingBullets||[],pb=m2.content.partBullets||[];now=lb.length?lb:pb;ok=(!lb.length||eSame(lb,r.to))&&(!pb.length||eSame(pb,r.to));if(!ok&&lb.length>r.to.length)r.extraNote=`Wayfair shows ${lb.length} bullets on the listing, ${r.to.length} were sent — remove the extra one(s) in Partner Home (WF-057).`;}else if(r.key==='groupName'){now=m2.content.groupName==null?['(not readable)']:[m2.content.groupName];ok=m2.content.groupName==null?null:eSame(now,r.to);}else if(r.key==='media'){now=[`${m2.wfImages.length} on Wayfair (was ${before.wfImages.length})`];ok=m2.wfImages.length>before.wfImages.length?true:null;}else if(r.id){const f=m2.fields.find(x=>x.id===r.id);now=f?f.cur:[];const sa=(before.fields.find(x=>x.id===r.id)||{}).sa;ok=eSame(now,r.to,eIsMC(sa));}return{field:r.field,to:r.to,now,ok,note:r.extraNote||null};});
E.w=w;E.m=m2;E.P=eInitP(m2);E.lastVal=null;E.readAt=new Date().toISOString();E.verify={at:E.readAt,rows};
wbLog('WF_WORKBENCH_EDIT_VERIFY',`Re-read ${E.spn} after submit: ${rows.filter(x=>x.ok===true).length} of ${rows.length} fields show the new value`,{spn:E.spn,env:q.env,rows,wb_version:WB_VERSION});}
catch(e){E.verify={at:new Date().toISOString(),err:'Re-read failed: '+(e.message||e),rows:[]};}}

async function cCats(){if(C.cats)return C.cats;const rows=await sbFetchAll(()=>sbClient.from('wayfair_taxonomy_categories').select('taxonomy_category_id,name,is_relevant').order('name',{ascending:true}));C.cats=rows.map(r=>({cid:String(r.taxonomy_category_id),name:r.name,rel:!!r.is_relevant})).sort((a,b)=>(b.rel?1:0)-(a.rel?1:0)||a.name.localeCompare(b.name));return C.cats;}

/* ─── part number: proposed CCD + SKU (stripped), checked against items.wayfair_sku AND the snapshot ─── */
function cProposeSpn(item){const s=String(item.sku||'').toUpperCase().replace(/[^A-Z0-9-]/g,'');return s?('CCD'+s):'';}
async function cCheckSpn(spn){const s=String(spn||'').trim();const out={spn:s,ok:false,why:null,at:Date.now()};if(!s){out.why='Enter a supplier part number.';return out;}if(!/^[A-Za-z0-9][A-Za-z0-9._\-]{2,63}$/.test(s)){out.why='Use 3–64 letters, digits, dot, dash or underscore.';return out;}
const a=await sbClient.from('items').select('id,sku').ilike('wayfair_sku',s).limit(5);if(a.error){out.why='items check failed: '+a.error.message;return out;}if(a.data&&a.data.length){out.why=`Already used as items.wayfair_sku by ${a.data.map(x=>x.sku).join(', ')}.`;return out;}
const b=await sbClient.from('wayfair_catalog_snapshot').select('supplier_part_number,status').ilike('supplier_part_number',s).limit(5);if(b.error){out.why='snapshot check failed: '+b.error.message;return out;}if(b.data&&b.data.length){out.why=`Already on Wayfair (snapshot: ${b.data.map(x=>x.supplier_part_number+' '+(x.status||'')).join(', ')}).`;return out;}
if(H.wf.some(w=>String(w.supplierPartNumber||'').toUpperCase()===s.toUpperCase())){out.why='Already on Wayfair (this session\'s Health read).';return out;}out.ok=true;return out;}

C.it={id,item,cid:String(item.wayfair_class_id||'').trim()||null,sch:null,P:{},src:{},spn:cProposeSpn(item),spnCheck:null,imgs:[],bullets:[],lastVal:null,prodChk:null,results:null,busy:false,prog:'',profile:[],notes:[],openedAt:new Date().toISOString(),job:null,track:null};

async function cRefreshProd(){const it=C.it;if(!it||!it.cid)return;it.prog='Reading the class schema from production…';cRender();try{delete SCH[Number(it.cid)];const r=await wbSchema(it.cid,true);if(!r.schema)throw new Error(r.note||'no schema');it.prog=r.source==='production'?`Production schema: ${r.ids.size} attribute IDs.`:'Production read failed — '+r.note;wbLog('WF_WORKBENCH_SCHEMA_IMPORT',`Schema refresh (production): class ${it.cid} → ${r.source}`,{env:WB.env,classes:[it.cid],source:r.source,via:'create',wb_version:WB_VERSION});C.cached&&C.cached.add(String(it.cid));await cLoadClass(it.cid);}catch(e){it.prog='Refresh failed: '+(e.message||e);cRender();}}
